<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LEXDESK — plataforma de estudo e prática jurídica para estudantes de Direito em Portugal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%237B1E2B%27/%3E%3Cg fill=%27none%27 stroke=%27%23FFFFFF%27 stroke-width=%271.8%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M16 7v18M12 25h8M8 11h16M8 11l-3 6a3 3 0 0 0 6 0zM24 11l-3 6a3 3 0 0 0 6 0z%27/%3E%3C/g%3E%3C/svg%3E">
<title>LEXDESK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--wine:#7B1E2B;--wine2:#5E1520;--wine-soft:#F7E9EB;--navy:#13203A;--navy2:#1B2A45;--navy3:#22324F;--gold:#C9A66B;--gold-soft:#F3ECDF;--bronze:#7A5C2E;--paper:#F5F6F8;--ink:#1A2233;--muted:#5B6577;--line:#E3E6EC;--line2:#DDE1E8;--link:#2F5BA8;--ok:#1E6B4F;--ok-soft:#EAF4EF;--bad:#A8442A;--bad-soft:#FBEDE8;--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--link)}a:hover{color:#1F4385}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:212px;flex:none;background:var(--navy);color:#E6E9F0;padding:18px 10px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none}
.mark{width:36px;height:36px;border-radius:8px;background:var(--wine);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:22px;flex:none}
.word{font-size:17px;letter-spacing:.14em;color:#fff}.word b{font-weight:700}.word span{color:var(--gold);font-weight:400}
.navgrp{display:flex;flex-direction:column;gap:3px}
.navlbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A0B8;padding:0 10px 4px}
.nav{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:7px;color:#D3D9E4;text-decoration:none;font-size:13.5px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:var(--navy2);color:#fff}
.mark.logo{padding:6px;box-shadow:inset 0 0 0 1px rgba(201,166,107,.35)}.mark.logo svg{width:100%;height:100%}
.nav.on{background:var(--wine2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}.nav.on svg{color:var(--gold)}
.nav svg{flex:none;width:16px;height:16px}
.navgrp{gap:2px}
.sidefoot{margin-top:auto;background:var(--navy2);border:1px solid #2C3D5E;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#B7C1D3}
.sidefoot strong{color:#fff;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#93A0B8}.dot.cloud{background:#6FCF97}.dot.local{background:var(--gold)}
.main{flex:1;min-width:0;padding:20px 44px 56px;display:flex;flex-direction:column;gap:24px;max-width:1400px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.search{flex:0 1 340px;max-width:360px;display:flex;align-items:center;gap:8px;min-height:34px;padding:0 10px;background:#fff;border:1px solid #C8CED8;border-radius:4px;color:var(--muted);font-size:13.5px}
.search svg{width:15px;height:15px;flex:none}.search:focus-within{border-color:var(--wine);box-shadow:0 0 0 2px var(--wine-soft)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink)}
.crumb{font-size:13px;color:var(--muted)}.crumb button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
h1{margin:0;font-family:var(--serif);font-size:34px;font-weight:600;color:var(--navy);line-height:1.2}
h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--navy)}
.card>h2:first-child,.card>.row:first-child>h2,.card>.row:first-child>div>h2{padding-left:12px;border-left:3px solid var(--wine)}
h3{margin:0;font-size:15px;font-weight:600}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid2{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.dark{background:var(--navy);border-color:var(--navy);color:#fff}.card.dark h2{color:#fff}.card.dark p{color:#C3CCDB}
.kpi .n{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--navy);line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .s{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #C8CED8;background:#fff;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#F0F2F5;color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:#0B1528;color:#fff}
.btn.wine{background:var(--wine);border-color:var(--wine);color:#fff}.btn.wine:hover{background:var(--wine2);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}.btn.gold:hover{background:#BE9A5D}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:#E3B4A6}.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line2);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#3A4458}
.icon-btn:hover{background:#F0F2F5}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#E8EEF8;color:var(--link)}
.chip.wine{background:var(--wine-soft);color:var(--wine)}.chip.gold{background:var(--gold-soft);color:#6B4F24}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.gray{background:#EDEFF3;color:#3A4458}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.li:hover{border-color:#C8CED8;background:#FAFBFC}
.li .ic{width:40px;height:40px;border-radius:8px;background:var(--gold-soft);color:var(--bronze);display:flex;align-items:center;justify-content:center;flex:none}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.li .tx b{font-size:15px;font-weight:600}.li .tx span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:#EDEFF3;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);border-radius:4px}
.empty{border:1px dashed #C8CED8;border-radius:12px;padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3A4458;font-weight:500}
.in{min-height:44px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.check{display:flex;gap:10px;align-items:center;font-size:14px;min-height:44px}
.check input{width:18px;height:18px;accent-color:var(--navy)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:0;background:none;padding:12px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab b{font-family:var(--serif);color:var(--bronze)}
.tab.on{color:var(--wine);font-weight:600;border-bottom-color:var(--wine)}
.seg{display:inline-flex;gap:4px;background:#F0F2F5;padding:4px;border-radius:10px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(19,32,58,.12)}
.opt{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:#fff;cursor:pointer;text-align:left;width:100%;font-size:15px;color:var(--ink)}
.opt:hover{border-color:#B9C0CC}
.opt .lt{width:30px;height:30px;border-radius:50%;background:#F0F2F5;color:#3A4458;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.opt.sel{border:2px solid var(--navy);background:#F0F2F5}.opt.sel .lt{background:var(--navy);color:#fff}
.opt.right{border:2px solid var(--ok);background:var(--ok-soft)}.opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-soft)}.opt.wrong .lt{background:var(--bad);color:#fff}
.opt .tg{margin-left:auto;font-size:12px;font-weight:700}
.fb{padding:16px 18px;border-radius:10px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.fb.ok{background:var(--ok-soft);border:1px solid #A9CDBB}.fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid #E3B4A6}.fb.bad b{color:var(--bad)}
.note{background:#F5F6F8;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;color:#3A4458;line-height:1.6}
.learn{border:1px solid #D9C7A6;background:#FBF7F0;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.learn .eyebrow{color:var(--bronze)}
.doc{font-family:'Times New Roman',Georgia,serif;font-size:15px;line-height:1.7;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px 36px;color:#111;max-height:780px;overflow:auto}
.split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.split>.a{flex:1 1 340px;min-width:0}.split>.b{flex:2 1 520px;min-width:0}
.arts{display:flex;flex-direction:column}
.art{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid #EDEFF3;font-size:14px}
.art:first-child{border-top:0}
.art .num{font-family:var(--serif);font-weight:700;color:var(--bronze);min-width:58px}
.art .ds{flex:1;min-width:0}
.overlay{position:fixed;inset:0;background:rgba(19,32,58,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(19,32,58,.3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(19,32,58,.3)}
.qnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.qnav button{height:42px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-weight:600;color:#3A4458}
.qnav button.done{background:var(--navy);border-color:var(--navy);color:#fff}
.qnav button.cur{border:2px solid var(--gold);background:#FBF7F0;color:var(--navy)}
.qnav button.r{background:var(--ok);border-color:var(--ok);color:#fff}.qnav button.w{background:var(--bad);border-color:var(--bad);color:#fff}
.score{font-family:var(--serif);font-size:56px;font-weight:600;color:var(--navy);line-height:1}
.wsic{width:40px;height:40px;border-radius:8px;background:var(--gold-soft);color:var(--bronze);display:flex;align-items:center;justify-content:center;flex:none}
.ttl{display:block;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);line-height:1.3}
button.card{text-align:left;cursor:pointer;font:inherit;color:inherit}button.card:hover{border-color:#C8CED8;box-shadow:0 2px 8px rgba(19,32,58,.06)}
.calwrap{display:flex;flex-wrap:wrap;gap:24px}
.cal{flex:3 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px}
.prox{flex:2 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cd{min-height:74px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:5px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;cursor:pointer;font:inherit;color:var(--ink);overflow:hidden;min-width:0}
.cd:hover{border-color:#B9C0CC}.cd.out{border:0;background:transparent;cursor:default}
.cd .dn{font-size:12px;font-weight:600;color:#3A4458}
.cd.today{border:2px solid var(--wine)}.cd.today .dn{color:var(--wine)}
.cd .ev{font-size:10.5px;font-weight:600;border-radius:4px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .more{font-size:10.5px;color:var(--muted)}
.horwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.hor{display:grid;grid-template-columns:58px repeat(6,minmax(110px,1fr));min-width:740px;position:relative;background:#fff}
.hh{font-size:12px;font-weight:700;color:#3A4458;text-align:center;align-self:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hh.on{color:var(--wine)}
.ht{font-size:11px;color:var(--muted);text-align:right;padding:0 8px 0 0;transform:translateY(-6px)}
.hl{border-top:1px solid #EDEFF3;pointer-events:none}.hl.half{border-top:1px dashed #F3F4F7}
.hb{margin:1px 3px;border:0;border-left:3px solid;border-radius:6px;padding:4px 6px;text-align:left;font:inherit;font-size:11.5px;display:flex;flex-direction:column;gap:1px;overflow:hidden;cursor:pointer;z-index:1;line-height:1.3}
.hb b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb:hover{filter:brightness(.97)}
@media (max-width:600px){.cd{min-height:48px}.cd .ev{display:none}.cd.has::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--bronze);align-self:center}}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:22px 26px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden;border-left:6px solid var(--wine)}
.hero h1{color:#fff;font-size:28px}.hero p{margin:0;color:#C3CCDB;font-size:15px;line-height:1.5}.hero p b{color:var(--gold)}
.hero-l{display:flex;flex-direction:column;gap:10px;flex:1 1 520px;min-width:0;max-width:760px;position:relative;z-index:1}
.hero-d{font-size:12px;color:#93A0B8;letter-spacing:.02em}
.hero-s{flex:none;width:100%;max-width:360px;border-color:transparent}
.hero-r{flex:0 0 120px;height:120px;border-radius:14px;background:var(--wine2);display:flex;align-items:center;justify-content:center}
.hero-mark{width:72px;height:72px;color:var(--gold);display:flex}.hero-mark svg{width:100%;height:100%}
.hero .btn{min-height:40px}
.btn.ghost{background:transparent;border-color:#3A4C6E;color:#fff}.btn.ghost:hover{background:var(--navy2);color:#fff}
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);min-width:0}
.dcard:hover{border-color:#C8CED8;box-shadow:0 2px 10px rgba(19,32,58,.07)}
.dcard.big{grid-column:span 2;background:var(--wine-soft);border-color:#E7C9CE}
.dcard .dt{font-family:var(--serif);font-weight:600;font-size:16px;color:var(--navy);line-height:1.35}
.dcard.big .dt{font-size:20px}
.dcard .dr{font-size:14px;color:#3A4458;line-height:1.6}
.dcard .dm{font-size:12px;color:var(--muted);margin-top:auto}
@media (max-width:700px){.dcard.big{grid-column:auto}.hero{padding:24px}.hero h1{font-size:30px}.hero-r{display:none}}
.promo{background:var(--wine2);border-radius:16px;padding:26px 28px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.conn{flex-direction:column;align-items:stretch;flex-wrap:nowrap;padding:32px 34px;background:var(--wine2);border-left:0}.conn h1{font-size:38px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ch{border:1px solid #8A3442;background:var(--wine);border-radius:14px;padding:22px;text-align:left;cursor:pointer;font:inherit;color:#fff;display:flex;flex-direction:column;gap:6px}
.ch:hover{border-color:var(--gold)}.ch.on{border:2px solid var(--gold);background:#6A1A25}
.cht{font-family:var(--serif);font-size:22px;font-weight:600;color:#fff}.chd{font-size:14px;color:#C3CCDB}
.av{width:44px;height:44px;border-radius:50%;background:var(--wine);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.upd.sel{border:2px solid var(--wine);box-shadow:0 4px 16px rgba(123,30,43,.18)}
.demo{opacity:.82}.hb.demo{border-left-style:dashed}.cd.demo .ev{opacity:.85}
.cadf{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:38px;padding:6px 8px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;font-size:13.5px;color:var(--ink)}
.cadf:hover{background:#F0F2F5}.cadf.on{background:var(--wine-soft);color:var(--wine);font-weight:600}
.aptxt{white-space:pre-wrap;font-family:var(--serif);font-size:17px;line-height:1.75;color:#1A2233;max-width:820px}
.sideperfil{margin-top:auto;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--wine2);border:1px solid #8A3442;border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:#fff}
.sideperfil:hover{border-color:var(--gold)}.sp-t{font-size:13px;font-weight:600}.sp-s{font-size:12px;color:#E6C9CE}
fieldset.disc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0}fieldset.disc legend{font-size:13px;font-weight:600;color:#3A4458;padding:0 6px}
.discs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 12px}.discs .check{min-height:36px;font-size:14px}
.card.minha{border:2px solid var(--wine)}
.dchip{border:1px solid #E7C9CE;background:var(--wine-soft);color:var(--wine);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.dchip:hover{background:#F0D9DD}
@media (max-width:900px){.sideperfil{display:none}}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-height:40px;margin-bottom:-8px}
.acct{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font:inherit;color:var(--ink)}
.acct:hover{border-color:#B9C0CC}.acct .av{width:32px;height:32px;font-size:13px}.acct b{font-size:13px;font-weight:600}.acct span.s{font-size:11px;color:var(--muted);display:block;line-height:1.2}
.login{max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center}
.login .mark{width:56px;height:56px;padding:10px;align-self:center;border-radius:12px}
.login ul{text-align:left;margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#3A4458}
.foot{font-size:12px;color:var(--muted);line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:900px){
 .app{flex-direction:column}
 .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:8px;padding:12px}
 .navgrp{flex-direction:row;flex-wrap:wrap}.navlbl,.sidefoot{display:none}
 .nav{width:auto}
 .main{padding:20px 16px 48px}
 h1{font-size:28px}
 .doc{padding:20px}
}
/* ================= TEMA 2026 — «ousado / startup» ================= */
:root{
  --ink:#0E1222;--muted:#5D6378;--paper:#F5F6FA;--line:#E8EAF1;--line2:#DDE0EA;
  --navy:#0E1222;--navy2:#171C33;--navy3:#20264A;
  --wine:#7B1E2B;--wine2:#5E1520;--wine-soft:#F4EEF0;
  --violet:#4338CA;--violet-soft:#ECEEFC;--gold:#FFB020;--gold-soft:#FFF4DC;--bronze:#9A5B00;
  --cyan:#06B6D4;--ok:#0E9F6E;--ok-soft:#E3F8EF;--bad:#E5484D;--bad-soft:#FDECEC;--link:#4338CA;
  --grad:linear-gradient(120deg,#8C1D30 0%,#7B1E2B 38%,#4338CA 100%);
  --grad-soft:linear-gradient(120deg,#F1F0F7 0%,#E8EBFA 100%);
  --grad-gold:linear-gradient(120deg,#FFB020,#FF6B35);
  --sh1:0 1px 2px rgba(14,18,34,.04),0 4px 14px rgba(14,18,34,.05);
  --sh2:0 2px 6px rgba(14,18,34,.06),0 18px 40px rgba(14,18,34,.10);
  --glow:0 10px 30px -8px rgba(67,56,202,.40);
  --serif:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html,body{background:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:-20vh -10vw auto auto;width:60vw;height:60vh;background:radial-gradient(closest-side,rgba(67,56,202,.07),transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;left:20vw;bottom:-25vh;width:55vw;height:55vh;background:radial-gradient(closest-side,rgba(123,30,43,.05),transparent 70%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
:focus-visible{outline:3px solid rgba(67,56,202,.45);outline-offset:2px}
a{color:var(--link)}
h1{font-family:var(--serif);font-weight:800;letter-spacing:-.03em;font-size:40px;color:var(--ink)}
h2{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;font-size:21px;color:var(--ink)}
.card>h2:first-child,.card>.row:first-child>h2,.card>.row:first-child>div>h2{border-left:0;padding-left:0}
.card>h2:first-child::before,.card>.row:first-child>h2::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--grad);margin-right:10px;vertical-align:2px}
.sub{color:var(--muted)}
.eyebrow{color:var(--wine);letter-spacing:.14em}

/* barra lateral */
.side{background:#0B0E1C;width:224px;padding:20px 12px;border-right:1px solid rgba(255,255,255,.04);background-image:radial-gradient(120% 40% at 0% 0%,rgba(123,30,43,.30),transparent 60%),radial-gradient(100% 30% at 100% 100%,rgba(67,56,202,.28),transparent 60%)}
.mark{background:var(--grad);color:#fff;border-radius:11px;box-shadow:var(--glow)}
.mark.logo{box-shadow:var(--glow);color:#fff}
.word{font-family:var(--serif);font-weight:800;letter-spacing:.06em;font-size:19px}.word span{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.navlbl{color:#6E7591;letter-spacing:.16em}
.nav{border-radius:10px;color:#C6CADB;transition:background .2s var(--ease),color .2s,transform .2s var(--ease)}
.nav:hover{background:rgba(255,255,255,.06);transform:translateX(2px)}
.nav.on{background:var(--grad);box-shadow:var(--glow);color:#fff}.nav.on svg{color:#fff}
.brand.nav:hover{transform:none}
.sidefoot{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
.sideperfil{background:linear-gradient(135deg,rgba(123,30,43,.30),rgba(67,56,202,.25));border:1px solid rgba(255,255,255,.12)}
.sideperfil:hover{border-color:rgba(255,176,32,.6)}
.kbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#AEB3C7;font:inherit;font-size:13px;cursor:pointer}
.kbtn:hover{border-color:rgba(255,255,255,.25);color:#fff}
.kbd{margin-left:auto;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.1);color:#fff;font-family:var(--sans)}

/* cartões e listas */
.card{border:1px solid rgba(14,18,34,.06);border-radius:22px;box-shadow:var(--sh1);transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
button.card:hover,.dcard:hover,.li:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.li{border-radius:14px;border-color:var(--line);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.li:hover{border-color:transparent;background:#fff}
.li .ic,.wsic{border-radius:12px;background:var(--grad-soft);color:var(--wine)}
.dcard{border-radius:18px;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.dcard.big{background:var(--grad-soft);border-color:transparent}
.dcard .dt,.ttl{font-family:var(--serif);font-weight:700;color:var(--ink);letter-spacing:-.01em}
.kpi{position:relative;overflow:hidden}
.kpi .n{font-family:var(--serif);font-weight:800;font-size:40px;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--grad-soft);z-index:0}
.kpi>*{position:relative;z-index:1}
.empty{border-radius:18px;border-color:#D8DBE8;background:rgba(255,255,255,.6)}
.note{border-radius:14px;background:#fff;border-color:var(--line)}
.bar{height:10px;border-radius:99px;background:#EEF0F5}.bar i{background:var(--grad);border-radius:99px;transition:width 1s var(--ease)}

/* botões */
.btn{border-radius:12px;border-color:var(--line2);font-weight:700;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s,filter .2s}
.btn:hover{transform:translateY(-1px);background:#fff;box-shadow:var(--sh1)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:var(--ink);border-color:var(--ink)}.btn.pri:hover{background:#1C2140;box-shadow:0 10px 24px -10px rgba(14,18,34,.6)}
.btn.wine{background:var(--grad);border:0;box-shadow:var(--glow);background-size:150% 100%;background-position:0 0}
.btn.wine:hover{background:var(--grad);background-size:150% 100%;background-position:100% 0;filter:saturate(1.15)}
.btn.gold{background:var(--grad-gold);border:0;color:#2A1600;box-shadow:0 10px 26px -10px rgba(255,107,53,.7)}.btn.gold:hover{background:var(--grad-gold);filter:brightness(1.05)}
.btn.ghost{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08);backdrop-filter:blur(6px)}.btn.ghost:hover{background:rgba(255,255,255,.18)}
.btn.danger{border-color:#F6C7C9;color:var(--bad)}
.icon-btn{border-radius:10px}
.chip{border-radius:99px;font-weight:700;background:var(--violet-soft);color:var(--violet)}
.chip.wine{background:var(--wine-soft);color:var(--wine)}.chip.gold{background:var(--gold-soft);color:var(--bronze)}

/* formulários */
.in,.search{border-radius:12px;border-color:var(--line2);transition:border-color .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px rgba(67,56,202,.12)}
.search{border-radius:12px;min-height:40px}.search:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px rgba(67,56,202,.12)}
.seg{border-radius:14px;background:#EEF0F5}.seg button{border-radius:10px}.seg button.on{box-shadow:var(--sh1);color:var(--wine)}
.tab.on{color:var(--wine);border-bottom:3px solid var(--wine)}
.tab b{font-family:var(--serif);color:var(--violet)}
.cadf.on{background:var(--grad-soft);color:var(--wine)}
.check input{accent-color:var(--wine)}

/* hero */
.hero{background:#0B0E1C;border:0;border-radius:28px;padding:34px 36px;box-shadow:0 30px 60px -30px rgba(14,18,34,.55);isolation:isolate}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(600px 300px at var(--mx,80%) var(--my,10%),rgba(123,30,43,.70),transparent 60%),radial-gradient(500px 320px at 10% 120%,rgba(67,56,202,.60),transparent 60%),radial-gradient(400px 260px at 100% 100%,rgba(255,176,32,.25),transparent 60%);transition:background .2s}
.hero::after{content:'';position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
.hero h1{font-size:52px;line-height:1.02;color:#fff}
.hero h1 .g{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#CDD1E4;font-size:16px}.hero p b{color:#FFC65C}
.hero-d{color:#A8AEC8;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700}
.hero-s{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#D9DCEB;backdrop-filter:blur(8px)}
.hero-s input{color:#fff}.hero-s input::placeholder{color:#AEB3C7}
.hero-orb{position:absolute;right:40px;top:50%;width:190px;height:190px;margin-top:-95px;border-radius:50%;background:conic-gradient(from 0deg,#8C1D30,#FFB020,#4338CA,#8C1D30);filter:blur(2px);opacity:.9;animation:spin 14s linear infinite;z-index:0}
.hero-orb::after{content:'';position:absolute;inset:14px;border-radius:50%;background:#0B0E1C;display:block}
.hero-orb i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;color:#fff;animation:spin 14s linear infinite reverse}
.hero-orb i svg{width:70px;height:70px}
@media (max-width:1100px){.hero-orb{display:none}}
.promo{background:#0B0E1C;border-radius:28px;position:relative;overflow:hidden;isolation:isolate}
.promo::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(500px 240px at 0% 0%,rgba(123,30,43,.65),transparent 60%),radial-gradient(500px 240px at 100% 100%,rgba(67,56,202,.55),transparent 60%)}
.conn{background:#0B0E1C}
.ch{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;transition:transform .25s var(--ease),border-color .2s}
.ch:hover{transform:translateY(-3px);border-color:#FFB020}.ch.on{background:rgba(255,255,255,.12);border-color:#FFB020}
.av{background:var(--grad);color:#fff}

/* modal, toast */
.overlay{background:rgba(11,14,28,.55);backdrop-filter:blur(6px);animation:fade .2s ease both}
.modal{border-radius:24px;box-shadow:0 40px 80px -20px rgba(11,14,28,.5);animation:pop .28s var(--ease) both}
.toast{background:#0B0E1C;border-radius:14px;box-shadow:0 18px 40px -10px rgba(11,14,28,.6);animation:toastIn .35s var(--ease) both;border:1px solid rgba(255,255,255,.08)}
.toast::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grad-gold);margin-right:10px;vertical-align:1px}

/* calendário e horário */
.cd{border-radius:12px;transition:transform .2s var(--ease),box-shadow .2s}
.cd:not(.out):hover{transform:translateY(-2px);box-shadow:var(--sh1)}
.cd.today{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box}
.horwrap{border-radius:16px}
.opt{border-radius:14px;transition:transform .2s var(--ease),border-color .2s}
.opt:hover{transform:translateX(3px)}
.score{font-family:var(--serif);font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.acct{border-radius:99px;box-shadow:var(--sh1)}

/* ===== animações ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.main.enter>*{animation:rise .55s var(--ease) both}
.main.enter>*:nth-child(2){animation-delay:.04s}.main.enter>*:nth-child(3){animation-delay:.08s}.main.enter>*:nth-child(4){animation-delay:.12s}
.main.enter>*:nth-child(5){animation-delay:.16s}.main.enter>*:nth-child(6){animation-delay:.2s}.main.enter>*:nth-child(7){animation-delay:.24s}
.main.enter>*:nth-child(n+8){animation-delay:.28s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== painel: gráficos de progresso ===== */
.prog{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
@media (max-width:700px){.prog>.card{grid-column:auto!important}}
.ring{position:relative;width:170px;height:170px;align-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--serif);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .v>span{font-size:12px;color:var(--muted)}
.ring circle.fg{animation:ringDraw 1.2s var(--ease) both}
@keyframes ringDraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:var(--off)}}
.chart{width:100%;height:190px;display:block}
.chart path.l{stroke-dasharray:var(--len,1200);animation:draw 1.4s var(--ease) both}
.chart circle{transition:r .2s}
.chart g.pt:hover circle{r:7}
.chart g.pt .tt{opacity:0;transition:opacity .15s}.chart g.pt:hover .tt{opacity:1}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bc i{display:block;width:100%;max-width:38px;border-radius:10px 10px 6px 6px;background:var(--grad);transform-origin:bottom;animation:growY .9s var(--ease) both}
.bars .bc.hoje i{background:var(--grad-gold)}
.bars .bc span{font-size:11px;font-weight:700;color:var(--muted)}.bars .bc em{font-style:normal;font-size:11px;color:var(--ink);font-weight:700}
.cdn{display:flex;flex-direction:column;gap:12px}
.cdn .it{display:flex;align-items:center;gap:12px}
.cdn .d{width:54px;height:54px;border-radius:16px;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;box-shadow:var(--glow)}
.cdn .d b{font-family:var(--serif);font-size:20px;font-weight:800;line-height:1}.cdn .d small{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cdn .it:nth-child(2) .d{background:linear-gradient(120deg,#6366F1,#4338CA);box-shadow:0 10px 30px -8px rgba(67,56,202,.45)}
.cdn .it:nth-child(3) .d{background:var(--grad-gold);box-shadow:0 10px 30px -8px rgba(255,107,53,.55)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tag-demo{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);background:var(--violet-soft);border-radius:99px;padding:3px 8px}

/* ===== pesquisa rápida (Ctrl+K) ===== */
.cmdk-ov{align-items:flex-start;padding-top:12vh}
.cmdk{background:#fff;border-radius:22px;width:100%;max-width:640px;box-shadow:0 40px 90px -20px rgba(11,14,28,.6);overflow:hidden;animation:pop .22s var(--ease) both}
.cmdk .q{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.cmdk .q svg{width:20px;height:20px;color:var(--violet);flex:none}
.cmdk .q input{flex:1;border:0;outline:none;font-size:18px;font-weight:500;background:transparent;min-width:0}
.cmdk .res{max-height:56vh;overflow:auto;padding:8px}
.cmdk .grp{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 12px 6px}
.cmdk .r{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.cmdk .r .ri{width:34px;height:34px;border-radius:10px;background:var(--grad-soft);color:var(--wine);display:flex;align-items:center;justify-content:center;flex:none}
.cmdk .r .ri svg{width:16px;height:16px}
.cmdk .r b{font-weight:600;font-size:14px;display:block}.cmdk .r span.s{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk .r .t{min-width:0;flex:1}
.cmdk .r.on{background:var(--grad);color:#fff}.cmdk .r.on span.s{color:rgba(255,255,255,.8)}.cmdk .r.on .ri{background:rgba(255,255,255,.2);color:#fff}
.cmdk .ft{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.cmdk .ft kbd{font-family:var(--sans);font-weight:700;font-size:11px;background:#EEF0F5;border-radius:6px;padding:2px 6px;margin-right:4px;color:var(--ink)}
.topsearch{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.8);backdrop-filter:blur(6px);color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;margin-right:auto;min-width:260px;transition:border-color .2s,box-shadow .2s}
.topsearch:hover{border-color:var(--violet);box-shadow:0 0 0 4px rgba(67,56,202,.1)}
.topsearch svg{width:16px;height:16px}.topsearch kbd{margin-left:auto;font-family:var(--sans);font-size:11px;font-weight:700;background:#EEF0F5;border-radius:6px;padding:2px 7px;color:var(--ink)}
.topbar{justify-content:flex-end}

/* ===== arrastar e largar ===== */
.dropzone{position:fixed;inset:14px;border-radius:28px;border:3px dashed rgba(255,255,255,.7);background:rgba(11,14,28,.6);backdrop-filter:blur(8px);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;pointer-events:none;animation:fade .15s ease both}
.dropzone b{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:-.02em}
.dropzone span{color:#CDD1E4}
.dropzone .di{width:76px;height:76px;border-radius:24px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:var(--glow);animation:pop .3s var(--ease) both}
.dropzone .di svg{width:34px;height:34px}
.li[draggable=true]{cursor:grab}.li.dragging{opacity:.4}
.tab.dropok{background:var(--grad-soft);border-radius:10px 10px 0 0;color:var(--wine)}
.fdrop{border:2px dashed #D8DBE8;border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:13px;transition:border-color .2s,background .2s;display:flex;flex-direction:column;gap:8px;align-items:center}
.fdrop.over{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.fdrop input{max-width:100%}
.fdrop b{color:var(--ink)}
@media (max-width:900px){.side{width:100%}.hero h1{font-size:38px}h1{font-size:32px}.topsearch{min-width:0;flex:1}}

/* ===== chat da comunidade ===== */
.chat{display:grid;grid-template-columns:220px minmax(0,1fr) 210px;gap:16px;height:calc(100vh - 210px);min-height:520px}
.chat-side,.chat-on{background:#fff;border:1px solid rgba(14,18,34,.06);border-radius:22px;box-shadow:var(--sh1);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.chat-side .hash{color:var(--muted);margin-right:6px;font-weight:700}.chat-side .cadf.on .hash{color:var(--wine)}

<script>
/* LEXDESK — conteúdo jurídico (v1). Referências: legislação portuguesa em vigor; confirmar sempre a redação no Diário da República. */
var DISC = {
  pc: { nome: 'Direito Processual Civil', curto: 'Processo Civil' },
  pp: { nome: 'Direito Processual Penal', curto: 'Processo Penal' },
  civ: { nome: 'Direito Civil', curto: 'Direito Civil' },
  con: { nome: 'Direito Constitucional', curto: 'Constitucional' },
  pen: { nome: 'Direito Penal', curto: 'Direito Penal' }
};

var QUESTOES = [
  // Processo Civil
  { id: 'pc1', d: 'pc', q: 'No processo declarativo comum, qual é o prazo de que o réu dispõe para contestar, a contar da citação?', o: ['10 dias', '15 dias', '20 dias', '30 dias'], a: 3,
    e: 'O réu pode contestar no prazo de 30 dias a contar da citação (art. 569.º, n.º 1, do CPC). O prazo é contínuo e suspende-se durante as férias judiciais (art. 138.º, n.º 1).' },
  { id: 'pc2', d: 'pc', q: 'Na falta de disposição especial, qual é o prazo para as partes requererem qualquer ato ou diligência, arguirem nulidades ou deduzirem incidentes?', o: ['5 dias', '10 dias', '15 dias', '30 dias'], a: 1,
    e: 'Na falta de disposição especial, o prazo é de 10 dias (art. 149.º, n.º 1, do CPC).' },
  { id: 'pc3', d: 'pc', q: 'Qual é o prazo-regra para a interposição de recurso em processo civil?', o: ['10 dias', '15 dias', '30 dias', '60 dias'], a: 2,
    e: 'O prazo é de 30 dias a contar da notificação da decisão, reduzindo-se para 15 dias nos processos urgentes e nos casos do n.º 2 do art. 644.º e do art. 677.º (art. 638.º, n.º 1, do CPC).' },
  { id: 'pc4', d: 'pc', q: 'Terminado um prazo perentório, o ato processual ainda pode ser praticado:', o: ['A todo o tempo, sem qualquer consequência', 'Nos 3 primeiros dias úteis seguintes, ficando a validade dependente do pagamento de multa', 'Nos 5 dias seguintes, sem multa', 'Apenas mediante prova de justo impedimento'], a: 1,
    e: 'Independentemente de justo impedimento, o ato pode ser praticado nos 3 primeiros dias úteis subsequentes ao termo do prazo, ficando a sua validade dependente do pagamento de multa (art. 139.º, n.º 5, do CPC). O justo impedimento é outra via, prevista no art. 140.º.' },
  { id: 'pc5', d: 'pc', q: 'Segundo o CPC de 2013, o processo comum de declaração:', o: ['Segue as formas ordinária, sumária e sumaríssima', 'Segue forma única', 'Segue forma ordinária ou sumária consoante o valor', 'Só existe para ações de valor superior à alçada da Relação'], a: 1,
    e: 'O processo comum de declaração segue forma única (art. 548.º do CPC). A distinção entre forma ordinária, sumária e sumaríssima pertencia ao CPC de 1961.' },
  { id: 'pc6', d: 'pc', q: 'Quanto ao seu fim, as ações declarativas podem ser:', o: ['De simples apreciação, de condenação ou constitutivas', 'Executivas, cautelares ou de condenação', 'Comuns ou especiais', 'Principais ou acessórias'], a: 0,
    e: 'As ações declarativas podem ser de simples apreciação, de condenação ou constitutivas (art. 10.º, n.º 2, do CPC). Comum e especial são formas de processo, não espécies de ação quanto ao fim.' },
  { id: 'pc7', d: 'pc', q: 'Se o réu, regularmente citado, não contestar, em regra:', o: ['O processo é arquivado', 'Consideram-se confessados os factos articulados pelo autor', 'O autor tem de provar todos os factos em audiência final', 'O réu é automaticamente condenado no pedido'], a: 1,
    e: 'Na revelia operante, consideram-se confessados os factos articulados pelo autor (art. 567.º, n.º 1, do CPC), ressalvadas as exceções do art. 568.º. A causa é depois julgada conforme for de direito (art. 567.º, n.º 2): a condenação não é automática.' },
  { id: 'pc8', d: 'pc', q: 'No CPC de 2013, a réplica é admissível:', o: ['Sempre que o réu deduza qualquer exceção', 'Para o autor deduzir defesa quanto à reconvenção e, nas ações de simples apreciação negativa, para impugnar os factos constitutivos alegados pelo réu', 'Apenas quando o juiz a convide', 'Em todas as ações de valor superior à alçada do tribunal de 1.ª instância'], a: 1,
    e: 'A réplica serve para o autor deduzir defesa quanto à matéria da reconvenção e, nas ações de simples apreciação negativa, para impugnar os factos constitutivos alegados pelo réu e alegar factos impeditivos ou extintivos (art. 584.º do CPC). A resposta às exceções faz-se, em regra, na audiência prévia ou no início da audiência final (art. 3.º, n.º 4).' },
  { id: 'pc9', d: 'pc', q: 'Os requisitos da petição inicial constam de que artigo do CPC atual?', o: ['Art. 467.º', 'Art. 552.º', 'Art. 569.º', 'Art. 590.º'], a: 1,
    e: 'Os requisitos da petição inicial estão no art. 552.º do CPC. O art. 467.º era o preceito correspondente no CPC de 1961.' },
  { id: 'pc10', d: 'pc', q: 'A falta ou ininteligibilidade da indicação do pedido ou da causa de pedir torna a petição inicial:', o: ['Irregular, sanável por mero convite', 'Inepta, gerando a nulidade de todo o processo', 'Anulável a requerimento do réu', 'Apenas suscetível de recusa pela secretaria'], a: 1,
    e: 'É nulo todo o processo quando for inepta a petição inicial, o que sucede, designadamente, quando falte ou seja ininteligível a indicação do pedido ou da causa de pedir (art. 186.º, n.ºs 1 e 2, al. a), do CPC).' },

  // Processo Penal
  { id: 'pp1', d: 'pp', q: 'Salvo disposição legal em contrário, qual é o prazo para a prática de qualquer ato processual penal?', o: ['5 dias', '10 dias', '15 dias', '20 dias'], a: 1,
    e: 'Salvo disposição legal em contrário, é de 10 dias o prazo para a prática de qualquer ato processual (art. 105.º, n.º 1, do CPP).' },
  { id: 'pp2', d: 'pp', q: 'Em regra, qual é o prazo para a interposição de recurso em processo penal?', o: ['10 dias', '15 dias', '20 dias', '30 dias'], a: 3,
    e: 'O prazo para interposição de recurso é de 30 dias (art. 411.º, n.º 1, do CPP).' },
  { id: 'pp3', d: 'pp', q: 'A abertura da instrução pode ser requerida no prazo de:', o: ['10 dias', '15 dias', '20 dias', '30 dias'], a: 2,

  { id: 'pp4', d: 'pp', q: 'Que medida de coação pode ser aplicada a qualquer pessoa constituída arguida?', o: ['Prisão preventiva', 'Obrigação de permanência na habitação', 'Termo de identidade e residência', 'Caução'], a: 2,
    e: 'O termo de identidade e residência é aplicável a todo o arguido (art. 196.º do CPP). As restantes medidas dependem de pressupostos específicos e dos princípios da necessidade, adequação e proporcionalidade (art. 193.º).' },
  { id: 'pp5', d: 'pp', q: 'A direção do inquérito cabe:', o: ['Ao juiz de instrução', 'Ao Ministério Público, assistido pelos órgãos de polícia criminal', 'Aos órgãos de polícia criminal, sob fiscalização do juiz', 'Ao assistente'], a: 1,
    e: 'A direção do inquérito cabe ao Ministério Público, assistido pelos órgãos de polícia criminal (art. 263.º, n.º 1, do CPP).' },
  { id: 'pp6', d: 'pp', q: 'A instrução em processo penal:', o: ['É obrigatória em todos os processos por crime', 'Tem caráter facultativo', 'Só existe nos processos sumários', 'É dirigida pelo Ministério Público'], a: 1,
    e: 'A instrução tem caráter facultativo (art. 286.º, n.º 2, do CPP) e é dirigida por um juiz de instrução (art. 288.º, n.º 1).' },
  { id: 'pp7', d: 'pp', q: 'Nos termos da al. a) do n.º 1 do art. 202.º do CPP, a prisão preventiva pode ser aplicada havendo fortes indícios de crime doloso punível com pena de prisão de máximo:', o: ['Superior a 3 anos', 'Superior a 5 anos', 'Superior a 8 anos', 'Igual ou superior a 10 anos'], a: 1,
    e: 'A al. a) do n.º 1 do art. 202.º do CPP refere-se a crime doloso punível com pena de prisão de máximo superior a 5 anos. As restantes alíneas preveem outros casos. Confirme sempre a redação em vigor.' },
  { id: 'pp8', d: 'pp', q: 'A detenção deve ser submetida a apreciação judicial no prazo máximo de:', o: ['24 horas', '48 horas', '72 horas', '5 dias'], a: 1,
    e: 'A detenção é submetida, no prazo máximo de 48 horas, a apreciação judicial (art. 28.º, n.º 1, da CRP; cf. arts. 141.º e 254.º do CPP).' },
  { id: 'pp9', d: 'pp', q: 'Qual é a finalidade do inquérito?', o: ['Comprovar judicialmente a decisão de deduzir acusação ou de arquivar', 'Investigar a existência de um crime, determinar os seus agentes e a sua responsabilidade e recolher as provas, em ordem à decisão sobre a acusação', 'Julgar o arguido', 'Aplicar medidas de coação'], a: 1,
    e: 'É a finalidade do inquérito prevista no art. 262.º, n.º 1, do CPP. A comprovação judicial da decisão de acusar ou arquivar é a finalidade da instrução (art. 286.º, n.º 1).' },

  // Direito Civil
  { id: 'cv1', d: 'civ', q: 'Qual é o prazo ordinário de prescrição no Código Civil?', o: ['5 anos', '10 anos', '15 anos', '20 anos'], a: 3,
    e: 'O prazo ordinário da prescrição é de 20 anos (art. 309.º do CC).' },
  { id: 'cv2', d: 'civ', q: 'Em regra, o direito de indemnização fundado em responsabilidade civil extracontratual prescreve no prazo de:', o: ['1 ano', '3 anos', '5 anos', '20 anos'], a: 1,
    e: 'Prescreve no prazo de 3 anos a contar da data em que o lesado teve conhecimento do direito que lhe compete, sem prejuízo da prescrição ordinária (art. 498.º, n.º 1, do CC).' },
  { id: 'cv3', d: 'civ', q: 'Na responsabilidade contratual, incumbe ao devedor provar que a falta de cumprimento ou o cumprimento defeituoso não procede de culpa sua. A norma é o:', o: ['Art. 483.º do CC', 'Art. 487.º do CC', 'Art. 799.º do CC', 'Art. 562.º do CC'], a: 2,
    e: 'É a presunção de culpa do devedor (art. 799.º, n.º 1, do CC). Na responsabilidade extracontratual, cabe ao lesado provar a culpa do autor da lesão, salvo presunção legal (art. 487.º, n.º 1).' },
  { id: 'cv4', d: 'civ', q: 'A nulidade de um negócio jurídico:', o: ['Só pode ser invocada pelas pessoas em cujo interesse a lei a estabelece', 'É invocável a todo o tempo por qualquer interessado e pode ser declarada oficiosamente pelo tribunal', 'Sana-se pelo decurso de 1 ano', 'Só pode ser declarada a requerimento do Ministério Público'], a: 1,
    e: 'A nulidade é invocável a todo o tempo por qualquer interessado e pode ser declarada oficiosamente pelo tribunal (art. 286.º do CC). A primeira opção descreve a legitimidade para arguir a anulabilidade (art. 287.º, n.º 1).' },
  { id: 'cv5', d: 'civ', q: 'Em regra, a anulabilidade deve ser arguida dentro de que prazo?', o: ['O ano subsequente à cessação do vício que lhe serve de fundamento', '3 anos a contar da celebração do negócio', '20 anos', 'A todo o tempo'], a: 0,
    e: 'A anulabilidade só pode ser arguida pelas pessoas em cujo interesse a lei a estabelece, dentro do ano subsequente à cessação do vício que lhe serve de fundamento (art. 287.º, n.º 1, do CC).' },
  { id: 'cv6', d: 'civ', q: 'É menor quem ainda não tiver completado:', o: ['16 anos', '17 anos', '18 anos', '21 anos'], a: 2,
    e: 'É menor quem não tiver ainda completado 18 anos de idade (art. 122.º do CC).' },
  { id: 'cv7', d: 'civ', q: 'A compra e venda de imóveis só é válida se for celebrada:', o: ['Por documento particular simples', 'Verbalmente, perante testemunhas', 'Por escritura pública ou por documento particular autenticado', 'Por qualquer forma, ao abrigo da liberdade de forma'], a: 2,
    e: 'Salvo disposição legal em contrário, o contrato de compra e venda de bens imóveis só é válido se for celebrado por escritura pública ou por documento particular autenticado (art. 875.º do CC).' },
  { id: 'cv8', d: 'civ', q: '"A validade da declaração negocial não depende da observância de forma especial, salvo quando a lei a exigir." Que princípio está aqui consagrado?', o: ['O princípio da autonomia privada', 'O princípio da liberdade de forma (art. 219.º do CC)', 'O princípio da boa-fé (art. 227.º do CC)', 'O princípio da tipicidade'], a: 1,
    e: 'É o princípio da liberdade de forma ou do consensualismo (art. 219.º do CC).' },
  { id: 'cv9', d: 'civ', q: 'Que norma manda atender, na fixação da indemnização, aos danos não patrimoniais que, pela sua gravidade, mereçam a tutela do direito?', o: ['Art. 496.º, n.º 1, do CC', 'Art. 494.º do CC', 'Art. 566.º do CC', 'Art. 70.º do CC'], a: 0,
    e: 'É o art. 496.º, n.º 1, do CC. O art. 494.º prevê a limitação da indemnização no caso de mera culpa, e o art. 566.º a indemnização em dinheiro.' },

  // Direito Constitucional
  { id: 'cn1', d: 'con', q: 'Os preceitos constitucionais respeitantes aos direitos, liberdades e garantias:', o: ['Dependem sempre de lei para serem aplicados', 'São diretamente aplicáveis e vinculam as entidades públicas e privadas', 'Vinculam apenas o Estado', 'Só são aplicáveis após regulamentação pelo Governo'], a: 1,
    e: 'São diretamente aplicáveis e vinculam as entidades públicas e privadas (art. 18.º, n.º 1, da CRP).' },
  { id: 'cn2', d: 'con', q: 'A pena de morte, em Portugal:', o: ['É admitida em tempo de guerra', 'Não existe em caso algum', 'É admitida para crimes militares', 'Depende de referendo'], a: 1,
    e: '"Em caso algum haverá pena de morte" (art. 24.º, n.º 2, da CRP).' },
  { id: 'cn3', d: 'con', q: 'Em que artigo da CRP está prevista a fiscalização preventiva da constitucionalidade?', o: ['Art. 278.º', 'Art. 280.º', 'Art. 281.º', 'Art. 283.º'], a: 0,
    e: 'A fiscalização preventiva está no art. 278.º. O art. 280.º regula a fiscalização concreta, o art. 281.º a fiscalização abstrata sucessiva e o art. 283.º a inconstitucionalidade por omissão.' },
  { id: 'cn4', d: 'con', q: 'O recurso para o Tribunal Constitucional de uma decisão que recusa a aplicação de uma norma com fundamento em inconstitucionalidade é um meio de:', o: ['Fiscalização preventiva', 'Fiscalização concreta', 'Fiscalização abstrata sucessiva', 'Inconstitucionalidade por omissão'], a: 1,
    e: 'Trata-se de fiscalização concreta da constitucionalidade (art. 280.º, n.º 1, al. a), da CRP).' },
  { id: 'cn5', d: 'con', q: 'Em regra, a Assembleia da República pode rever a Constituição decorridos quantos anos sobre a data da publicação da última lei de revisão ordinária?', o: ['4 anos', '5 anos', '10 anos', 'Não há prazo'], a: 1,
    e: 'Decorridos 5 anos (art. 284.º, n.º 1, da CRP). O n.º 2 permite a revisão extraordinária, a todo o tempo, por maioria de quatro quintos dos Deputados em efetividade de funções.' },
  { id: 'cn6', d: 'con', q: 'Em que artigo da CRP está consagrado o princípio da igualdade?', o: ['Art. 2.º', 'Art. 13.º', 'Art. 18.º', 'Art. 20.º'], a: 1,
    e: 'O princípio da igualdade está no art. 13.º da CRP.' },
  { id: 'cn7', d: 'con', q: 'Que norma garante o acesso ao direito e aos tribunais, não podendo a justiça ser denegada por insuficiência de meios económicos?', o: ['Art. 20.º, n.º 1, da CRP', 'Art. 32.º da CRP', 'Art. 202.º da CRP', 'Art. 268.º da CRP'], a: 0,
    e: 'É o art. 20.º, n.º 1, da CRP (acesso ao direito e tutela jurisdicional efetiva).' },
  { id: 'cn8', d: 'con', q: 'Em que artigo da CRP estão os limites materiais da revisão constitucional?', o: ['Art. 284.º', 'Art. 286.º', 'Art. 288.º', 'Art. 289.º'], a: 2,
    e: 'Os limites materiais estão no art. 288.º. Os limites circunstanciais (estado de sítio ou de emergência) estão no art. 289.º.' },

  // Direito Penal
  { id: 'pn1', d: 'pen', q: '"Só pode ser punido criminalmente o facto descrito e declarado passível de pena por lei anterior ao momento da sua prática." Que princípio é este?', o: ['O princípio da culpa', 'O princípio da legalidade', 'O princípio da proporcionalidade', 'O princípio da intervenção mínima'], a: 1,
    e: 'É o princípio da legalidade (art. 1.º, n.º 1, do CP; cf. art. 29.º da CRP).' },
  { id: 'pn2', d: 'pen', q: 'Age com dolo eventual quem:', o: ['Representa o facto e atua com intenção de o realizar', 'Representa a realização do facto como consequência necessária da sua conduta', 'Representa a realização do facto como consequência possível da sua conduta e atua conformando-se com essa realização', 'Não chega a representar a possibilidade de realização do facto'], a: 2,
    e: 'É o dolo eventual (art. 14.º, n.º 3, do CP). As outras opções correspondem ao dolo direto (n.º 1), ao dolo necessário (n.º 2) e à negligência inconsciente (art. 15.º, al. b)).' },
  { id: 'pn3', d: 'pen', q: 'Salvo disposição em contrário, a tentativa só é punível se ao crime consumado corresponder pena superior a:', o: ['1 ano de prisão', '2 anos de prisão', '3 anos de prisão', '5 anos de prisão'], a: 2,
    e: 'A tentativa só é punível se ao crime consumado corresponder pena superior a 3 anos de prisão (art. 23.º, n.º 1, do CP).' },
  { id: 'pn4', d: 'pen', q: 'São inimputáveis em razão da idade os menores de:', o: ['12 anos', '14 anos', '16 anos', '18 anos'], a: 2,
    e: 'Os menores de 16 anos são inimputáveis (art. 19.º do CP).' },
  { id: 'pn5', d: 'pen', q: 'Quais são as finalidades das penas e das medidas de segurança?', o: ['A retribuição e a expiação da culpa', 'A proteção de bens jurídicos e a reintegração do agente na sociedade', 'A intimidação geral da comunidade', 'A reparação do dano causado à vítima'], a: 1,
    e: 'A aplicação de penas e de medidas de segurança visa a proteção de bens jurídicos e a reintegração do agente na sociedade (art. 40.º, n.º 1, do CP). A pena não pode ultrapassar a medida da culpa (n.º 2).' },
  { id: 'pn6', d: 'pen', q: 'Com que pena é punido o homicídio simples (art. 131.º do CP)?', o: ['Prisão de 3 a 10 anos', 'Prisão de 5 a 15 anos', 'Prisão de 8 a 16 anos', 'Prisão de 12 a 25 anos'], a: 2,
    e: 'Quem matar outra pessoa é punido com pena de prisão de 8 a 16 anos (art. 131.º do CP).' },
  { id: 'pn7', d: 'pen', q: 'Em regra, qual é a duração máxima da pena de prisão?', o: ['16 anos', '20 anos', '25 anos', '30 anos'], a: 1,
    e: 'A pena de prisão tem, em regra, a duração máxima de 20 anos. O limite máximo é de 25 anos nos casos previstos na lei (art. 41.º, n.ºs 1 e 2, do CP).' },
  { id: 'pn8', d: 'pen', q: 'Em que artigo do CP está prevista a legítima defesa?', o: ['Art. 31.º', 'Art. 32.º', 'Art. 34.º', 'Art. 35.º'], a: 1,
    e: 'A legítima defesa está no art. 32.º do CP. O art. 31.º enuncia as causas de exclusão da ilicitude em geral, o art. 34.º o direito de necessidade e o art. 35.º o estado de necessidade desculpante.' }
];

var CASOS = [
  { id: 'caso-pc1', d: 'pc', titulo: 'A falta de contestação',
    enunciado: 'A propôs uma ação declarativa comum contra B, pedindo a sua condenação no pagamento de 20.000 €, correspondentes ao preço de obras realizadas na moradia de B. B foi regularmente citado na sua própria pessoa e não apresentou contestação no prazo legal.',
    perguntas: ['Quais são os efeitos da falta de contestação de B?', 'Em que situações esses efeitos não se produziriam?', 'O tribunal está obrigado a condenar B no pedido?'],
    topicos: ['Prazo de contestação: 30 dias a contar da citação (art. 569.º, n.º 1, do CPC).', 'Revelia operante: consideram-se confessados os factos articulados pelo autor (art. 567.º, n.º 1).', 'Exceções à revelia operante (art. 568.º), por exemplo: pluralidade de réus em que algum conteste, réu incapaz ou citado editalmente que permaneça em revelia absoluta, vontade das partes ineficaz para produzir o efeito jurídico pretendido, ou factos para cuja prova se exija documento escrito.', 'Após a confissão dos factos, o processo é facultado às partes para alegações escritas e a causa é julgada conforme for de direito (art. 567.º, n.º 2): a condenação não é automática e o juiz aprecia o enquadramento jurídico.'] },
  { id: 'caso-civ1', d: 'civ', titulo: 'Responsabilidade civil médica',

var LS_KEY = 'lexdesk_v1';

  if (!SB) { Social.updState = 'offline'; return; }
  Store.db = SBdb; S.user = SBuser; Social.start();

    var se = r && r.data && r.data.session;
    if (se) Store.attach(se); else { S.connecting = false; scheduleRender(); }

Store.attach = function (session) {
  if (Store.uid === session.user.id) return;

  Store.unsub = col.onSnapshot(function (snap) {
    var cloud = {};

function dataLonga(s) { var d = parseYmd(s); return d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear(); }
function minutos(t) { var p = String(t || '').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function meta() { return Store.get('meta_plano') || { id: 'meta_plano', kind: 'meta', letivo: {} }; }
function exames() { return Store.all('exame').sort(function (a, b) { return (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || '')); }); }

function cadSelect(sel) {
  var cs = cads();
  if (!cs.length) return '<div class="note">Ainda não tem cadeiras no plano de estudos. <button class="btn sm" data-a="go-cads" style="margin-left:6px">Criar plano de estudos</button></div><input type="hidden" id="f-cad" value="">';
  return '<label class="f">Cadeira<select class="in" id="f-cad">' + [1, 2, 3, 4].map(function (a) {
    var l = cs.filter(function (c) { return c.ano === a; }); if (!l.length) return '';
    return '<optgroup label="' + a + '.º ano">' + l.map(function (c) { return '<option value="' + c.id + '"' + (sel === c.id ? ' selected' : '') + '>' + esc(c.nome) + '</option>'; }).join('') + '</optgroup>';
  }).join('') + '</select></label>';
}

/* ----- Calendário (painel) ----- */
function vCalendario() {
  var c = S.cal || (S.cal = { y: new Date().getFullYear(), m: new Date().getMonth() });
  var ex = exames(), demo = !ex.length, porDia = {};
  if (demo) ex = demoExames();
  ex.forEach(function (e) { (porDia[e.data] = porDia[e.data] || []).push(e); });
  var first = new Date(c.y, c.m, 1), off = (first.getDay() + 6) % 7, nd = new Date(c.y, c.m + 1, 0).getDate(), hj = ymd(new Date());
  var cells = '';
  for (var i = 0; i < off; i++) cells += '<span class="cd out" aria-hidden="true"></span>';
  for (var d = 1; d <= nd; d++) {
    var k = c.y + '-' + String(c.m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'), l = porDia[k] || [];
    cells += '<button class="cd' + (k === hj ? ' today' : '') + (l.length ? ' has' : '') + (demo && l.length ? ' demo' : '') + '" data-a="' + (demo && l.length ? 'demo-ex' : 'cal-day') + '" data-id="' + k + '" aria-label="' + d + ' de ' + MESES[c.m] + (l.length ? ', ' + plural(l.length, 'avaliação', 'avaliações') : '') + '"><span class="dn">' + d + '</span>' +
      l.slice(0, 2).map(function (e) { var co = cor(e.cadId); return '<span class="ev" style="background:' + co[0] + ';color:' + co[1] + '">' + esc(exNome(e)) + '</span>'; }).join('') + (l.length > 2 ? '<span class="more">+' + (l.length - 2) + '</span>' : '') + '</button>';
  }
  var prox = ex.filter(function (e) { return diasAte(e.data) >= 0; }).slice(0, 6);
  return '<section class="card" aria-labelledby="cal-h"><div class="row" style="justify-content:space-between"><h2 id="cal-h">Calendário de exames' + (demo ? ' <span class="chip gray" style="vertical-align:middle;font-family:var(--sans)">Exemplos</span>' : '') + '</h2><button class="btn sm pri" data-a="ex-new">' + I.plus + 'Adicionar data</button></div>' +
    '<div class="calwrap"><div class="cal"><div class="row" style="justify-content:space-between"><button class="icon-btn" data-a="cal-prev" aria-label="Mês anterior">‹</button><b style="font-family:var(--serif);font-size:17px;color:var(--navy);text-transform:none">' + MESES[c.m].charAt(0).toUpperCase() + MESES[c.m].slice(1) + ' ' + c.y + '</b><button class="icon-btn" data-a="cal-next" aria-label="Mês seguinte">›</button></div>' +
    '<div class="cgrid">' + ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(function (x) { return '<span class="cw">' + x + '</span>'; }).join('') + cells + '</div>' +
    '<button class="btn sm" data-a="cal-today" style="align-self:flex-start">Hoje</button></div>' +
    '<div class="prox"><span class="eyebrow">Próximas avaliações</span>' + (prox.length ? '<div class="list">' + prox.map(function (e) {
      var n = diasAte(e.data), co = cor(e.cadId);
      return '<button class="li' + (e.demo ? ' demo' : '') + '" data-a="' + (e.demo ? 'demo-ex' : 'ex-open') + '" data-id="' + e.id + '"><span class="ic" style="background:' + co[0] + ';color:' + co[1] + ';flex-direction:column;line-height:1"><b style="font-size:15px">' + parseYmd(e.data).getDate() + '</b><span style="font-size:10px;text-transform:uppercase">' + MESES[parseYmd(e.data).getMonth()].slice(0, 3) + '</span></span><span class="tx"><b>' + esc(exNome(e)) + '</b><span>' + esc(e.tipo) + (e.hora ? ' · ' + esc(e.hora) : '') + (e.sala ? ' · ' + esc(e.sala) : '') + '</span></span>' + (e.demo ? '<span class="chip gray">Exemplo</span>' : '') + '<span class="chip ' + (n <= 7 ? 'bad' : n <= 21 ? 'gold' : 'gray') + '">' + faltam(e.data) + '</span></button>';
    }).join('') + '</div>' : '<div class="empty" style="padding:20px"><span>Sem avaliações marcadas. Adicione as datas dos exames de cada cadeira.</span></div>') + '</div></div></section>';
}
function exForm(e) {
  return cadSelect(e.cadId) +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px"><label class="f">Tipo<select class="in" id="f-tipo-av">' + TIPOS_AV.map(function (t) { return '<option' + (e.tipo === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label>' +
    '<label class="f">Data<input class="in" type="date" id="f-data" value="' + esc(e.data) + '"></label><label class="f">Hora<input class="in" type="time" id="f-hora" value="' + esc(e.hora) + '"></label></div>' +
    '<label class="f">Sala ou local (opcional)<input class="in" id="f-sala" value="' + esc(e.sala) + '" maxlength="80"></label>' +
    '<label class="f">Notas (opcional)<textarea class="in" id="f-notas" maxlength="2000" placeholder="Matéria, materiais permitidos, época…">' + esc(e.notas) + '</textarea></label>';
}
function openEx(e) {
  S.editEx = clone(e);
  openModal(e.id ? 'Avaliação' : 'Nova avaliação', exForm(e), (e.id ? '<button class="btn danger" data-a="ex-del" style="margin-right:auto">Eliminar</button>' : '') + '<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="ex-save"' + (cads().length ? '' : ' disabled') + '>Guardar</button>');
}

/* ----- Horário (painel) ----- */
function vHorario() {
  var aulas = Store.all('aula'), demo = !aulas.length, rows = (H1 - H0) * 2, hojeD = (new Date().getDay() + 6) % 7;
  var h = '<section class="card" aria-labelledby="hor-h"><div class="row" style="justify-content:space-between"><h2 id="hor-h">Horário semanal</h2><button class="btn sm pri" data-a="aula-new">' + I.plus + 'Adicionar aula</button></div>';
  if (demo) { aulas = demoAulas(); h += '<div class="note">Estas aulas são exemplos para ver como o horário funciona. Desaparecem quando adicionar a sua primeira aula.</div>'; }
  h += '<div class="horwrap"><div class="hor" style="grid-template-rows:36px repeat(' + rows + ',18px)">';
  h += '<span class="hh" style="grid-column:1;grid-row:1"></span>' + DIAS.map(function (d, i) { return '<span class="hh' + (i === hojeD ? ' on' : '') + '" style="grid-column:' + (i + 2) + ';grid-row:1">' + d + '</span>'; }).join('');
  for (var r = 0; r < rows; r++) {
    if (r % 2 === 0) h += '<span class="ht" style="grid-column:1;grid-row:' + (r + 2) + ' / span 2">' + String(H0 + r / 2).padStart(2, '0') + ':00</span>';
    h += '<span class="hl' + (r % 2 ? ' half' : '') + '" style="grid-column:2 / span 6;grid-row:' + (r + 2) + '"></span>';
  }
  aulas.forEach(function (a) {
    var s = Math.max(0, Math.round((minutos(a.ini) - H0 * 60) / 30)), e = Math.min(rows, Math.round((minutos(a.fim) - H0 * 60) / 30)); if (e <= s) return;
    var co = cor(a.cadId);
    h += '<button class="hb' + (a.demo ? ' demo' : '') + '" data-a="' + (a.demo ? 'demo-aula' : 'aula-open') + '" data-id="' + a.id + '" style="grid-column:' + (a.dia + 2) + ';grid-row:' + (s + 2) + ' / ' + (e + 2) + ';background:' + co[0] + ';border-left-color:' + co[1] + ';color:' + co[1] + '"><b>' + esc(exNome(a)) + '</b><span>' + esc(a.ini) + '–' + esc(a.fim) + (a.sala ? ' · ' + esc(a.sala) : '') + '</span>' + (e - s > 2 ? '<span>' + esc(a.tipo) + '</span>' : '') + '</button>';
  });
  return h + '</div></div></section>';
}
function aulaForm(a) {
  return cadSelect(a.cadId) +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px"><label class="f">Dia<select class="in" id="f-dia">' + DIAS.map(function (d, i) { return '<option value="' + i + '"' + (a.dia === i ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select></label>' +
    '<label class="f">Início<input class="in" type="time" id="f-ini" value="' + esc(a.ini || '09:00') + '" step="1800"></label><label class="f">Fim<input class="in" type="time" id="f-fim" value="' + esc(a.fim || '10:30') + '" step="1800"></label></div>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px"><label class="f">Tipo<select class="in" id="f-tipo-aula">' + TIPOS_AULA.map(function (t) { return '<option' + (a.tipo === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label>' +
    '<label class="f">Sala (opcional)<input class="in" id="f-sala" value="' + esc(a.sala) + '" maxlength="60"></label></div>';
}
function openAula(a) {
  S.editAula = clone(a);
  openModal(a.id ? 'Aula' : 'Nova aula', aulaForm(a), (a.id ? '<button class="btn danger" data-a="aula-del" style="margin-right:auto">Eliminar</button>' : '') + '<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="aula-save"' + (cads().length ? '' : ' disabled') + '>Guardar</button>');
}

/* ----- Cadeiras (plano de estudos) ----- */
function vCadeiras() {
  var cs = cads(), ano = S.ano || (S.ano = 1), m = meta();
  var h = '<div class="head"><div><h1>Cadeiras</h1><p class="sub">Plano de estudos por ano: 4 anos, 10 cadeiras por ano.</p></div>' + (cs.length ? '<button class="btn pri" data-a="cad-new">' + I.plus + 'Adicionar cadeira</button>' : '') + '</div>';
  if (!cs.length) return h + '<div class="card"><div class="empty"><b style="color:var(--navy);font-size:16px">Ainda não tem plano de estudos</b><span>Pode começar com um plano de exemplo de uma licenciatura em Direito (40 cadeiras, 10 por ano), que depois adapta ao plano da sua faculdade, ou criar as cadeiras uma a uma.</span><div class="row" style="justify-content:center"><button class="btn pri" data-a="cad-exemplo">Usar plano de exemplo</button><button class="btn" data-a="cad-new">Criar do zero</button></div></div></div>';
  h += '<div class="tabs" role="tablist">' + [1, 2, 3, 4].map(function (a) {
    var l = cs.filter(function (c) { return c.ano === a; }), ap = l.filter(function (c) { return c.estado === 'Aprovada'; }).length;
    return '<button class="tab' + (ano === a ? ' on' : '') + '" role="tab" aria-selected="' + (ano === a) + '" data-a="ano-tab" data-id="' + a + '"><b>' + a + '.º</b> ano' + (m.letivo[a] ? ' · ' + esc(m.letivo[a]) : '') + ' <span class="chip ' + (ap === l.length && l.length ? 'ok' : 'gray') + '" style="padding:2px 8px">' + ap + '/' + l.length + '</span></button>';
  }).join('') + '</div>';
  var l = cs.filter(function (c) { return c.ano === ano; });
  var notas = l.filter(function (c) { return c.estado === 'Aprovada' && c.nota !== '' && c.nota != null; }).map(function (c) { return Number(c.nota); });
  var media = notas.length ? (notas.reduce(function (s, x) { return s + x; }, 0) / notas.length).toFixed(1).replace('.', ',') : '—';
  h += '<div class="grid">' +
    '<div class="card kpi" style="gap:6px"><span class="l">Ano letivo</span><span class="n" style="font-size:26px">' + (m.letivo[ano] ? esc(m.letivo[ano]) : '—') + '</span><button class="btn sm" data-a="letivo-edit" style="align-self:flex-start">Definir</button></div>' +
    kpi('Cadeiras do ' + ano + '.º ano', l.length, l.length === 10 ? 'Plano completo' : l.length < 10 ? 'Faltam ' + (10 - l.length) + ' para as 10' : 'Mais de 10 cadeiras') +
    kpi('Aprovadas', l.filter(function (c) { return c.estado === 'Aprovada'; }).length, l.filter(function (c) { return c.estado === 'Em curso'; }).length + ' em curso') +
    kpi('Média do ano', media, notas.length ? 'com base em ' + plural(notas.length, 'nota', 'notas') : 'Sem notas lançadas') + '</div>';
  h += '<div class="grid2">' + [1, 2].map(function (sem) {
    var ls = l.filter(function (c) { return c.sem === sem; });
    return '<div class="card"><h2>' + sem + '.º semestre</h2>' + (ls.length ? '<div class="list">' + ls.map(cadRow).join('') + '</div>' : '<div class="empty" style="padding:18px">Sem cadeiras neste semestre.</div>') + '</div>';
  }).join('') + '</div>';
  return h;
}
function cadRow(c) {
  var ne = Store.all('exame').filter(function (e) { return e.cadId === c.id; }), na = Store.all('aula').filter(function (a) { return a.cadId === c.id; }).length;
  var px = ne.filter(function (e) { return diasAte(e.data) >= 0; }).sort(function (a, b) { return a.data.localeCompare(b.data); })[0];
  var co = cor(c.id), chip = c.estado === 'Aprovada' ? 'ok' : c.estado === 'Em curso' ? 'gold' : 'gray';
  return '<button class="li" data-a="cad-open" data-id="' + c.id + '"><span class="ic" style="background:' + co[0] + ';color:' + co[1] + '">' + I.book + '</span><span class="tx"><b>' + esc(c.nome) + '</b><span>' + (px ? esc(px.tipo) + ' a ' + dataLonga(px.data) + ' · ' : '') + plural(na, 'aula', 'aulas') + ' no horário</span></span>' +
    (c.estado === 'Aprovada' && c.nota !== '' && c.nota != null ? '<span class="chip ok">' + esc(c.nota) + ' val.</span>' : '<span class="chip ' + chip + '">' + esc(c.estado || 'Por fazer') + '</span>') + '</button>';
}
function cadForm(c) {
  return '<label class="f">Nome da cadeira<input class="in" id="f-cnome" value="' + esc(c.nome) + '" maxlength="120"></label>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px"><label class="f">Ano<select class="in" id="f-cano">' + [1, 2, 3, 4].map(function (a) { return '<option value="' + a + '"' + (c.ano === a ? ' selected' : '') + '>' + a + '.º ano</option>'; }).join('') + '</select></label>' +
    '<label class="f">Semestre<select class="in" id="f-csem"><option value="1"' + (c.sem === 1 ? ' selected' : '') + '>1.º semestre</option><option value="2"' + (c.sem === 2 ? ' selected' : '') + '>2.º semestre</option></select></label></div>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px"><label class="f">Estado<select class="in" id="f-cest">' + ESTADOS.map(function (e) { return '<option' + ((c.estado || 'Por fazer') === e ? ' selected' : '') + '>' + e + '</option>'; }).join('') + '</select></label>' +
    '<label class="f">Nota final (0–20)<input class="in" id="f-cnota" type="number" min="0" max="20" step="0.1" value="' + esc(c.nota) + '"></label></div>' +
    '<label class="f">Docente (opcional)<input class="in" id="f-cdoc" value="' + esc(c.docente) + '" maxlength="120"></label>';
}
function openCad(c) {
  S.editCad = clone(c);
  var extra = '';
  if (c.id) {
    var ex = Store.all('exame').filter(function (e) { return e.cadId === c.id; }).sort(function (a, b) { return a.data.localeCompare(b.data); });
    var au = Store.all('aula').filter(function (a) { return a.cadId === c.id; }).sort(function (a, b) { return a.dia - b.dia || a.ini.localeCompare(b.ini); });
    extra = '<div class="note" style="display:flex;flex-direction:column;gap:6px"><b>Avaliações</b>' + (ex.length ? ex.map(function (e) { return '<span>' + esc(e.tipo) + ' — ' + dataLonga(e.data) + (e.hora ? ', ' + esc(e.hora) : '') + ' (' + faltam(e.data).toLowerCase() + ')</span>'; }).join('') : '<span>Sem datas marcadas.</span>') +
      '<b style="margin-top:6px">Horário</b>' + (au.length ? au.map(function (a) { return '<span>' + DIAS[a.dia] + ', ' + esc(a.ini) + '–' + esc(a.fim) + ' · ' + esc(a.tipo) + (a.sala ? ' · ' + esc(a.sala) : '') + '</span>'; }).join('') : '<span>Sem aulas no horário.</span>') +
      '<div class="row" style="margin-top:6px"><button class="btn sm" data-a="cad-add-ex">' + I.plus + 'Data de exame</button><button class="btn sm" data-a="cad-add-aula">' + I.plus + 'Aula</button><button class="btn sm" data-a="cad-ws">Criar workspace</button></div></div>';
  }
  openModal(c.id ? 'Cadeira' : 'Nova cadeira', cadForm(c) + extra, (c.id ? '<button class="btn danger" data-a="cad-del" style="margin-right:auto">Eliminar</button>' : '') + '<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="cad-save">Guardar</button>');
}
function readCad() {
  var c = S.editCad;
  c.nome = $('#f-cnome').value.trim(); c.ano = Number($('#f-cano').value); c.sem = Number($('#f-csem').value);
  c.estado = $('#f-cest').value; c.docente = $('#f-cdoc').value.trim();
  var n = $('#f-cnota').value.trim(); c.nota = n === '' ? '' : Math.max(0, Math.min(20, Number(n.replace(',', '.'))));
  return c;
}

var A2 = {
  'go-cads': function () { closeModal(); go('cadeiras'); },
  'cal-prev': function () { S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } render(); },
  'cal-next': function () { S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } render(); },
  'cal-today': function () { S.cal = null; render(); },
  'cal-day': function (el) {
    var k = el.dataset.id, l = exames().filter(function (e) { return e.data === k; });
    if (!l.length) { openEx({ data: k, tipo: 'Exame' }); return; }
    openModal(dataLonga(k), '<div class="list">' + l.map(function (e) { var co = cor(e.cadId); return '<button class="li" data-a="ex-open" data-id="' + e.id + '"><span class="ic" style="background:' + co[0] + ';color:' + co[1] + '">' + I.check + '</span><span class="tx"><b>' + esc(cadNome(e.cadId)) + '</b><span>' + esc(e.tipo) + (e.hora ? ' · ' + esc(e.hora) : '') + (e.sala ? ' · ' + esc(e.sala) : '') + '</span></span></button>'; }).join('') + '</div>',
      '<button class="btn" data-a="close">Fechar</button><button class="btn pri" data-a="ex-new-day" data-id="' + k + '">' + I.plus + 'Outra avaliação neste dia</button>');
  },
  'ex-new': function () { openEx({ data: ymd(new Date()), tipo: 'Exame' }); },
  'ex-new-day': function (el) { openEx({ data: el.dataset.id, tipo: 'Exame' }); },
  'ex-open': function (el) { var e = Store.get(el.dataset.id); if (e) openEx(e); },
  'ex-save': function () {
    var e = S.editEx; e.cadId = $('#f-cad').value; e.tipo = $('#f-tipo-av').value; e.data = $('#f-data').value; e.hora = $('#f-hora').value; e.sala = $('#f-sala').value.trim(); e.notas = $('#f-notas').value;

    Store.put(e); var d = parseYmd(e.data); S.cal = { y: d.getFullYear(), m: d.getMonth() }; closeModal(); toast('Avaliação guardada.');
  },
  'ex-del': function () { Store.del(S.editEx.id); closeModal(); toast('Avaliação eliminada.'); },
  'aula-new': function () { openAula({ dia: 0, ini: '09:00', fim: '10:30', tipo: 'Teórica' }); },

  'aula-save': function () {
    var a = S.editAula; a.cadId = $('#f-cad').value; a.dia = Number($('#f-dia').value); a.ini = $('#f-ini').value; a.fim = $('#f-fim').value; a.tipo = $('#f-tipo-aula').value; a.sala = $('#f-sala').value.trim();
    if (!a.cadId) { toast('Escolha a cadeira.'); return; }

    if (!a.id) { a.id = uid('au'); a.kind = 'aula'; }
    Store.put(a); closeModal(); toast('Aula guardada.');
  },
  'aula-del': function () { Store.del(S.editAula.id); closeModal(); toast('Aula eliminada.'); },
  'ano-tab': function (el) { S.ano = Number(el.dataset.id); render(); },
  'letivo-edit': function () {
    var m = meta();

function ativRestante(a) { if (a.tipo === 'exame') return Math.max(0, Math.ceil((a.fim - Date.now()) / 1000)); if (!a.dur) return 0; return Math.max(0, Math.ceil((a.inicio + a.dur * 1000 - Date.now()) / 1000)); }

  if (bad.length) toast(plural(bad.length, 'ficheiro ignorado', 'ficheiros ignorados') + ': só PDF, Word, imagem ou texto, até 20 MB.');
  if (!files.length) return;
  toast('A carregar ' + plural(files.length, 'ficheiro', 'ficheiros') + '…');
  (function next(i) {
    if (i >= files.length) { touchWs(wsId); toast(ok ? plural(ok, 'ficheiro carregado', 'ficheiros carregados') + (fail ? ' · ' + fail + ' com erro' : '') + '.' : 'Não foi possível carregar os ficheiros.'); return; }
    var f = files[i];
    SBws.upload(f).then(function (r) {
      ok++; Store.put({ id: uid('it'), kind: 'item', wsId: wsId, pasta: pasta, tipo: 'ficheiro', titulo: f.name.replace(/\.[^.]+$/, ''), texto: '', ficheiro: { id: r.id, nome: f.name, tipo: r.contentType, tamanho: r.sizeBytes } });
    }, function () { fail++; }).then(function () { next(i + 1); });
  })(0);
}
// mover documentos entre pastas (arrastar o documento para outro separador)
document.addEventListener('dragstart', function (e) {
  var li = e.target.closest && e.target.closest('[data-drag-id]'); if (!li) return;
  e.dataTransfer.setData('text/lx-item', li.dataset.dragId); e.dataTransfer.effectAllowed = 'move'; li.classList.add('dragging');
});
document.addEventListener('dragend', function (e) { var li = e.target.closest && e.target.closest('[data-drag-id]'); if (li) li.classList.remove('dragging'); [].forEach.call(document.querySelectorAll('.tab.dropok'), function (x) { x.classList.remove('dropok'); }); });
document.addEventListener('dragover', function (e) {
  var t = e.dataTransfer && e.dataTransfer.types; if (!t || [].indexOf.call(t, 'text/lx-item') < 0) return;
  var tab = e.target.closest && e.target.closest('[data-a="ws-tab"]');
  [].forEach.call(document.querySelectorAll('.tab.dropok'), function (x) { if (x !== tab) x.classList.remove('dropok'); });
  if (tab) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; tab.classList.add('dropok'); }
});
document.addEventListener('drop', function (e) {
  var t = e.dataTransfer && e.dataTransfer.types; if (!t || [].indexOf.call(t, 'text/lx-item') < 0) return;
  var tab = e.target.closest && e.target.closest('[data-a="ws-tab"]'); if (!tab) return; e.preventDefault();
  var it = Store.get(e.dataTransfer.getData('text/lx-item')); if (!it || it.pasta === tab.dataset.id) return;
  it = clone(it); it.pasta = tab.dataset.id; Store.put(it); touchWs(it.wsId);
  var p = PASTAS.filter(function (x) { return x[0] === it.pasta; })[0]; toast('«' + it.titulo + '» movido para ' + p[0] + ' — ' + p[1] + '.');
});
// campos de ficheiro como zonas de largar
function fxEnhance() {
  [].forEach.call(document.querySelectorAll('#ap-file,#f-file'), function (inp) {
    if (inp.dataset.fx) return; inp.dataset.fx = '1';
    var lab = inp.closest('label'); if (!lab) return; lab.classList.add('fdrop');
    var hint = document.createElement('span'); hint.innerHTML = '<b>Arraste o ficheiro para aqui</b> ou escolha-o abaixo'; lab.insertBefore(hint, inp);
    inp.addEventListener('change', function () { var f = inp.files && inp.files[0]; if (f) hint.innerHTML = '<b>' + esc(f.name) + '</b> · ' + tamanho(f.size); });
  });
}
var _openModal = openModal;
openModal = function (t, b, a) { _openModal(t, b, a); fxEnhance(); };
var _itemType = A['item-type'];
A['item-type'] = function (el, ev) { _itemType(el, ev); fxEnhance(); };

/* ---------- arranque ---------- */
Store.loadLocal();
var h0 = location.hash.replace('#', ''); if (VIEWS.indexOf(h0) >= 0) S.view = h0;
render();
Store.connect();
})();

</script>
