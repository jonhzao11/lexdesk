<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LEXDESK — plataforma de estudo e prática jurídica para estudantes de Direito em Portugal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%237B1E2B%27/%3E%3Cg fill=%27none%27 stroke=%27%23C9A66B%27 stroke-width=%271.8%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M16 7v18M12 25h8M8 11h16M8 11l-3 6a3 3 0 0 0 6 0zM24 11l-3 6a3 3 0 0 0 6 0z%27/%3E%3C/g%3E%3C/svg%3E">
<title>LEXDESK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
:root{--wine:#7B1E2B;--wine2:#5E1520;--wine-soft:#F7E9EB;--navy:#13203A;--navy2:#1B2A45;--navy3:#22324F;--gold:#C9A66B;--gold-soft:#F3ECDF;--bronze:#7A5C2E;--paper:#F5F6F8;--ink:#1A2233;--muted:#5B6577;--line:#E3E6EC;--line2:#DDE1E8;--link:#2F5BA8;--ok:#1E6B4F;--ok-soft:#EAF4EF;--bad:#A8442A;--bad-soft:#FBEDE8;--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--link)}a:hover{color:#1F4385}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:212px;flex:none;background:var(--navy);color:#E6E9F0;padding:18px 10px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none}
.mark{width:36px;height:36px;border-radius:8px;background:var(--wine);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:22px;flex:none}
.word{font-size:17px;letter-spacing:.14em;color:#fff}.word b{font-weight:700}.word span{color:var(--gold);font-weight:400}
.navgrp{display:flex;flex-direction:column;gap:3px}
.navlbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A0B8;padding:0 10px 4px}
.nav{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:7px;color:#D3D9E4;text-decoration:none;font-size:13.5px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:var(--navy2);color:#fff}
.mark.logo{padding:6px;box-shadow:inset 0 0 0 1px rgba(201,166,107,.35)}.mark.logo svg{width:100%;height:100%}
.nav.on{background:var(--wine2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}.nav.on svg{color:var(--gold)}
.nav svg{flex:none;width:16px;height:16px}
.navgrp{gap:2px}
.sidefoot{margin-top:auto;background:var(--navy2);border:1px solid #2C3D5E;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#B7C1D3}
.sidefoot strong{color:#fff;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#93A0B8}.dot.cloud{background:#6FCF97}.dot.local{background:var(--gold)}
.main{flex:1;min-width:0;padding:20px 44px 56px;display:flex;flex-direction:column;gap:24px;max-width:1400px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.search{flex:0 1 340px;max-width:360px;display:flex;align-items:center;gap:8px;min-height:34px;padding:0 10px;background:#fff;border:1px solid #C8CED8;border-radius:4px;color:var(--muted);font-size:13.5px}
.search svg{width:15px;height:15px;flex:none}.search:focus-within{border-color:var(--wine);box-shadow:0 0 0 2px var(--wine-soft)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink)}
.crumb{font-size:13px;color:var(--muted)}.crumb button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
h1{margin:0;font-family:var(--serif);font-size:34px;font-weight:600;color:var(--navy);line-height:1.2}
h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--navy)}
.card>h2:first-child,.card>.row:first-child>h2,.card>.row:first-child>div>h2{padding-left:12px;border-left:3px solid var(--wine)}
h3{margin:0;font-size:15px;font-weight:600}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid2{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.dark{background:var(--navy);border-color:var(--navy);color:#fff}.card.dark h2{color:#fff}.card.dark p{color:#C3CCDB}
.kpi .n{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--navy);line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .s{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #C8CED8;background:#fff;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#F0F2F5;color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:#0B1528;color:#fff}
.btn.wine{background:var(--wine);border-color:var(--wine);color:#fff}.btn.wine:hover{background:var(--wine2);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}.btn.gold:hover{background:#BE9A5D}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:#E3B4A6}.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line2);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#3A4458}
.icon-btn:hover{background:#F0F2F5}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#E8EEF8;color:var(--link)}
.chip.wine{background:var(--wine-soft);color:var(--wine)}.chip.gold{background:var(--gold-soft);color:#6B4F24}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.gray{background:#EDEFF3;color:#3A4458}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.li:hover{border-color:#C8CED8;background:#FAFBFC}
.li .ic{width:40px;height:40px;border-radius:8px;background:var(--gold-soft);color:var(--bronze);display:flex;align-items:center;justify-content:center;flex:none}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.li .tx b{font-size:15px;font-weight:600}.li .tx span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:#EDEFF3;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);border-radius:4px}
.empty{border:1px dashed #C8CED8;border-radius:12px;padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3A4458;font-weight:500}
.in{min-height:44px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.check{display:flex;gap:10px;align-items:center;font-size:14px;min-height:44px}
.check input{width:18px;height:18px;accent-color:var(--navy)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:0;background:none;padding:12px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab b{font-family:var(--serif);color:var(--bronze)}
.tab.on{color:var(--wine);font-weight:600;border-bottom-color:var(--wine)}
.seg{display:inline-flex;gap:4px;background:#F0F2F5;padding:4px;border-radius:10px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(19,32,58,.12)}
.opt{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:#fff;cursor:pointer;text-align:left;width:100%;font-size:15px;color:var(--ink)}
.opt:hover{border-color:#B9C0CC}
.opt .lt{width:30px;height:30px;border-radius:50%;background:#F0F2F5;color:#3A4458;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.opt.sel{border:2px solid var(--navy);background:#F0F2F5}.opt.sel .lt{background:var(--navy);color:#fff}
.opt.right{border:2px solid var(--ok);background:var(--ok-soft)}.opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-soft)}.opt.wrong .lt{background:var(--bad);color:#fff}
.opt .tg{margin-left:auto;font-size:12px;font-weight:700}
.fb{padding:16px 18px;border-radius:10px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.fb.ok{background:var(--ok-soft);border:1px solid #A9CDBB}.fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid #E3B4A6}.fb.bad b{color:var(--bad)}
.note{background:#F5F6F8;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;color:#3A4458;line-height:1.6}
.learn{border:1px solid #D9C7A6;background:#FBF7F0;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.learn .eyebrow{color:var(--bronze)}
.doc{font-family:'Times New Roman',Georgia,serif;font-size:15px;line-height:1.7;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px 36px;color:#111;max-height:780px;overflow:auto}
.split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.split>.a{flex:1 1 340px;min-width:0}.split>.b{flex:2 1 520px;min-width:0}
.arts{display:flex;flex-direction:column}
.art{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid #EDEFF3;font-size:14px}
.art:first-child{border-top:0}
.art .num{font-family:var(--serif);font-weight:700;color:var(--bronze);min-width:58px}
.art .ds{flex:1;min-width:0}
.overlay{position:fixed;inset:0;background:rgba(19,32,58,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(19,32,58,.3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(19,32,58,.3)}
.qnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.qnav button{height:42px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-weight:600;color:#3A4458}
.qnav button.done{background:var(--navy);border-color:var(--navy);color:#fff}
.qnav button.cur{border:2px solid var(--gold);background:#FBF7F0;color:var(--navy)}
.qnav button.r{background:var(--ok);border-color:var(--ok);color:#fff}.qnav button.w{background:var(--bad);border-color:var(--bad);color:#fff}
.score{font-family:var(--serif);font-size:56px;font-weight:600;color:var(--navy);line-height:1}
.wsic{width:40px;height:40px;border-radius:8px;background:var(--gold-soft);color:var(--bronze);display:flex;align-items:center;justify-content:center;flex:none}
.ttl{display:block;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);line-height:1.3}
button.card{text-align:left;cursor:pointer;font:inherit;color:inherit}button.card:hover{border-color:#C8CED8;box-shadow:0 2px 8px rgba(19,32,58,.06)}
.calwrap{display:flex;flex-wrap:wrap;gap:24px}
.cal{flex:3 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px}
.prox{flex:2 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cd{min-height:74px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:5px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;cursor:pointer;font:inherit;color:var(--ink);overflow:hidden;min-width:0}
.cd:hover{border-color:#B9C0CC}.cd.out{border:0;background:transparent;cursor:default}
.cd .dn{font-size:12px;font-weight:600;color:#3A4458}
.cd.today{border:2px solid var(--wine)}.cd.today .dn{color:var(--wine)}
.cd .ev{font-size:10.5px;font-weight:600;border-radius:4px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .more{font-size:10.5px;color:var(--muted)}
.horwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.hor{display:grid;grid-template-columns:58px repeat(6,minmax(110px,1fr));min-width:740px;position:relative;background:#fff}
.hh{font-size:12px;font-weight:700;color:#3A4458;text-align:center;align-self:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hh.on{color:var(--wine)}
.ht{font-size:11px;color:var(--muted);text-align:right;padding:0 8px 0 0;transform:translateY(-6px)}
.hl{border-top:1px solid #EDEFF3;pointer-events:none}.hl.half{border-top:1px dashed #F3F4F7}
.hb{margin:1px 3px;border:0;border-left:3px solid;border-radius:6px;padding:4px 6px;text-align:left;font:inherit;font-size:11.5px;display:flex;flex-direction:column;gap:1px;overflow:hidden;cursor:pointer;z-index:1;line-height:1.3}
.hb b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb:hover{filter:brightness(.97)}
@media (max-width:600px){.cd{min-height:48px}.cd .ev{display:none}.cd.has::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--bronze);align-self:center}}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:22px 26px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden;border-left:6px solid var(--wine)}
.hero h1{color:#fff;font-size:28px}.hero p{margin:0;color:#C3CCDB;font-size:15px;line-height:1.5}.hero p b{color:var(--gold)}
.hero-l{display:flex;flex-direction:column;gap:10px;flex:1 1 520px;min-width:0;max-width:760px;position:relative;z-index:1}
.hero-d{font-size:12px;color:#93A0B8;letter-spacing:.02em}
.hero-s{flex:none;width:100%;max-width:360px;border-color:transparent}
.hero-r{flex:0 0 120px;height:120px;border-radius:14px;background:var(--wine2);display:flex;align-items:center;justify-content:center}
.hero-mark{width:72px;height:72px;color:var(--gold);display:flex}.hero-mark svg{width:100%;height:100%}
.hero .btn{min-height:40px}
.btn.ghost{background:transparent;border-color:#3A4C6E;color:#fff}.btn.ghost:hover{background:var(--navy2);color:#fff}
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);min-width:0}
.dcard:hover{border-color:#C8CED8;box-shadow:0 2px 10px rgba(19,32,58,.07)}
.dcard.big{grid-column:span 2;background:var(--wine-soft);border-color:#E7C9CE}
.dcard .dt{font-family:var(--serif);font-weight:600;font-size:16px;color:var(--navy);line-height:1.35}
.dcard.big .dt{font-size:20px}
.dcard .dr{font-size:14px;color:#3A4458;line-height:1.6}
.dcard .dm{font-size:12px;color:var(--muted);margin-top:auto}
@media (max-width:700px){.dcard.big{grid-column:auto}.hero{padding:24px}.hero h1{font-size:30px}.hero-r{display:none}}
.promo{background:var(--wine2);border-radius:16px;padding:26px 28px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.conn{flex-direction:column;align-items:stretch;flex-wrap:nowrap;padding:32px 34px;background:var(--wine2);border-left:0}.conn h1{font-size:38px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ch{border:1px solid #8A3442;background:var(--wine);border-radius:14px;padding:22px;text-align:left;cursor:pointer;font:inherit;color:#fff;display:flex;flex-direction:column;gap:6px}
.ch:hover{border-color:var(--gold)}.ch.on{border:2px solid var(--gold);background:#6A1A25}
.cht{font-family:var(--serif);font-size:22px;font-weight:600;color:#fff}.chd{font-size:14px;color:#C3CCDB}
.av{width:44px;height:44px;border-radius:50%;background:var(--wine);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.upd.sel{border:2px solid var(--wine);box-shadow:0 4px 16px rgba(123,30,43,.18)}
.demo{opacity:.82}.hb.demo{border-left-style:dashed}.cd.demo .ev{opacity:.85}
.cadf{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:38px;padding:6px 8px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;font-size:13.5px;color:var(--ink)}
.cadf:hover{background:#F0F2F5}.cadf.on{background:var(--wine-soft);color:var(--wine);font-weight:600}
.aptxt{white-space:pre-wrap;font-family:var(--serif);font-size:17px;line-height:1.75;color:#1A2233;max-width:820px}
.sideperfil{margin-top:auto;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--wine2);border:1px solid #8A3442;border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:#fff}
.sideperfil:hover{border-color:var(--gold)}.sp-t{font-size:13px;font-weight:600}.sp-s{font-size:12px;color:#E6C9CE}
fieldset.disc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0}fieldset.disc legend{font-size:13px;font-weight:600;color:#3A4458;padding:0 6px}
.discs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 12px}.discs .check{min-height:36px;font-size:14px}
.card.minha{border:2px solid var(--wine)}
.dchip{border:1px solid #E7C9CE;background:var(--wine-soft);color:var(--wine);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.dchip:hover{background:#F0D9DD}
@media (max-width:900px){.sideperfil{display:none}}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-height:40px;margin-bottom:-8px}
.acct{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font:inherit;color:var(--ink)}
.acct:hover{border-color:#B9C0CC}.acct .av{width:32px;height:32px;font-size:13px}.acct b{font-size:13px;font-weight:600}.acct span.s{font-size:11px;color:var(--muted);display:block;line-height:1.2}
.login{max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center}

<script>
/* LEXDESK — conteúdo jurídico (v1). Referências: legislação portuguesa em vigor; confirmar sempre a redação no Diário da República. */
var DISC = {
  pc: { nome: 'Direito Processual Civil', curto: 'Processo Civil' },
  pp: { nome: 'Direito Processual Penal', curto: 'Processo Penal' },
  civ: { nome: 'Direito Civil', curto: 'Direito Civil' },
  con: { nome: 'Direito Constitucional', curto: 'Constitucional' },
  pen: { nome: 'Direito Penal', curto: 'Direito Penal' }
};

var QUESTOES = [
  // Processo Civil
  { id: 'pc1', d: 'pc', q: 'No processo declarativo comum, qual é o prazo de que o réu dispõe para contestar, a contar da citação?', o: ['10 dias', '15 dias', '20 dias', '30 dias'], a: 3,
    e: 'O réu pode contestar no prazo de 30 dias a contar da citação (art. 569.º, n.º 1, do CPC). O prazo é contínuo e suspende-se durante as férias judiciais (art. 138.º, n.º 1).' },
  { id: 'pc2', d: 'pc', q: 'Na falta de disposição especial, qual é o prazo para as partes requererem qualquer ato ou diligência, arguirem nulidades ou deduzirem incidentes?', o: ['5 dias', '10 dias', '15 dias', '30 dias'], a: 1,
    e: 'Na falta de disposição especial, o prazo é de 10 dias (art. 149.º, n.º 1, do CPC).' },
  { id: 'pc3', d: 'pc', q: 'Qual é o prazo-regra para a interposição de recurso em processo civil?', o: ['10 dias', '15 dias', '30 dias', '60 dias'], a: 2,
    e: 'O prazo é de 30 dias a contar da notificação da decisão, reduzindo-se para 15 dias nos processos urgentes e nos casos do n.º 2 do art. 644.º e do art. 677.º (art. 638.º, n.º 1, do CPC).' },
  { id: 'pc4', d: 'pc', q: 'Terminado um prazo perentório, o ato processual ainda pode ser praticado:', o: ['A todo o tempo, sem qualquer consequência', 'Nos 3 primeiros dias úteis seguintes, ficando a validade dependente do pagamento de multa', 'Nos 5 dias seguintes, sem multa', 'Apenas mediante prova de justo impedimento'], a: 1,
    e: 'Independentemente de justo impedimento, o ato pode ser praticado nos 3 primeiros dias úteis subsequentes ao termo do prazo, ficando a sua validade dependente do pagamento de multa (art. 139.º, n.º 5, do CPC). O justo impedimento é outra via, prevista no art. 140.º.' },
  { id: 'pc5', d: 'pc', q: 'Segundo o CPC de 2013, o processo comum de declaração:', o: ['Segue as formas ordinária, sumária e sumaríssima', 'Segue forma única', 'Segue forma ordinária ou sumária consoante o valor', 'Só existe para ações de valor superior à alçada da Relação'], a: 1,
    e: 'O processo comum de declaração segue forma única (art. 548.º do CPC). A distinção entre forma ordinária, sumária e sumaríssima pertencia ao CPC de 1961.' },
  { id: 'pc6', d: 'pc', q: 'Quanto ao seu fim, as ações declarativas podem ser:', o: ['De simples apreciação, de condenação ou constitutivas', 'Executivas, cautelares ou de condenação', 'Comuns ou especiais', 'Principais ou acessórias'], a: 0,
    e: 'As ações declarativas podem ser de simples apreciação, de condenação ou constitutivas (art. 10.º, n.º 2, do CPC). Comum e especial são formas de processo, não espécies de ação quanto ao fim.' },
  { id: 'pc7', d: 'pc', q: 'Se o réu, regularmente citado, não contestar, em regra:', o: ['O processo é arquivado', 'Consideram-se confessados os factos articulados pelo autor', 'O autor tem de provar todos os factos em audiência final', 'O réu é automaticamente condenado no pedido'], a: 1,
    e: 'Na revelia operante, consideram-se confessados os factos articulados pelo autor (art. 567.º, n.º 1, do CPC), ressalvadas as exceções do art. 568.º. A causa é depois julgada conforme for de direito (art. 567.º, n.º 2): a condenação não é automática.' },
  { id: 'pc8', d: 'pc', q: 'No CPC de 2013, a réplica é admissível:', o: ['Sempre que o réu deduza qualquer exceção', 'Para o autor deduzir defesa quanto à reconvenção e, nas ações de simples apreciação negativa, para impugnar os factos constitutivos alegados pelo réu', 'Apenas quando o juiz a convide', 'Em todas as ações de valor superior à alçada do tribunal de 1.ª instância'], a: 1,
    e: 'A réplica serve para o autor deduzir defesa quanto à matéria da reconvenção e, nas ações de simples apreciação negativa, para impugnar os factos constitutivos alegados pelo réu e alegar factos impeditivos ou extintivos (art. 584.º do CPC). A resposta às exceções faz-se, em regra, na audiência prévia ou no início da audiência final (art. 3.º, n.º 4).' },
  { id: 'pc9', d: 'pc', q: 'Os requisitos da petição inicial constam de que artigo do CPC atual?', o: ['Art. 467.º', 'Art. 552.º', 'Art. 569.º', 'Art. 590.º'], a: 1,
    e: 'Os requisitos da petição inicial estão no art. 552.º do CPC. O art. 467.º era o preceito correspondente no CPC de 1961.' },
  { id: 'pc10', d: 'pc', q: 'A falta ou ininteligibilidade da indicação do pedido ou da causa de pedir torna a petição inicial:', o: ['Irregular, sanável por mero convite', 'Inepta, gerando a nulidade de todo o processo', 'Anulável a requerimento do réu', 'Apenas suscetível de recusa pela secretaria'], a: 1,
    e: 'É nulo todo o processo quando for inepta a petição inicial, o que sucede, designadamente, quando falte ou seja ininteligível a indicação do pedido ou da causa de pedir (art. 186.º, n.ºs 1 e 2, al. a), do CPC).' },

  // Processo Penal
  { id: 'pp1', d: 'pp', q: 'Salvo disposição legal em contrário, qual é o prazo para a prática de qualquer ato processual penal?', o: ['5 dias', '10 dias', '15 dias', '20 dias'], a: 1,

  { id: 'pp2', d: 'pp', q: 'Em regra, qual é o prazo para a interposição de recurso em processo penal?', o: ['10 dias', '15 dias', '20 dias', '30 dias'], a: 3,

  { id: 'pp3', d: 'pp', q: 'A abertura da instrução pode ser requerida no prazo de:', o: ['10 dias', '15 dias', '20 dias', '30 dias'], a: 2,

  { id: 'pp4', d: 'pp', q: 'Que medida de coação pode ser aplicada a qualquer pessoa constituída arguida?', o: ['Prisão preventiva', 'Obrigação de permanência na habitação', 'Termo de identidade e residência', 'Caução'], a: 2,
    e: 'O termo de identidade e residência é aplicável a todo o arguido (art. 196.º do CPP). As restantes medidas dependem de pressupostos específicos e dos princípios da necessidade, adequação e proporcionalidade (art. 193.º).' },
  { id: 'pp5', d: 'pp', q: 'A direção do inquérito cabe:', o: ['Ao juiz de instrução', 'Ao Ministério Público, assistido pelos órgãos de polícia criminal', 'Aos órgãos de polícia criminal, sob fiscalização do juiz', 'Ao assistente'], a: 1,
    e: 'A direção do inquérito cabe ao Ministério Público, assistido pelos órgãos de polícia criminal (art. 263.º, n.º 1, do CPP).' },
  { id: 'pp6', d: 'pp', q: 'A instrução em processo penal:', o: ['É obrigatória em todos os processos por crime', 'Tem caráter facultativo', 'Só existe nos processos sumários', 'É dirigida pelo Ministério Público'], a: 1,
    e: 'A instrução tem caráter facultativo (art. 286.º, n.º 2, do CPP) e é dirigida por um juiz de instrução (art. 288.º, n.º 1).' },
  { id: 'pp7', d: 'pp', q: 'Nos termos da al. a) do n.º 1 do art. 202.º do CPP, a prisão preventiva pode ser aplicada havendo fortes indícios de crime doloso punível com pena de prisão de máximo:', o: ['Superior a 3 anos', 'Superior a 5 anos', 'Superior a 8 anos', 'Igual ou superior a 10 anos'], a: 1,
    e: 'A al. a) do n.º 1 do art. 202.º do CPP refere-se a crime doloso punível com pena de prisão de máximo superior a 5 anos. As restantes alíneas preveem outros casos. Confirme sempre a redação em vigor.' },
  { id: 'pp8', d: 'pp', q: 'A detenção deve ser submetida a apreciação judicial no prazo máximo de:', o: ['24 horas', '48 horas', '72 horas', '5 dias'], a: 1,
    e: 'A detenção é submetida, no prazo máximo de 48 horas, a apreciação judicial (art. 28.º, n.º 1, da CRP; cf. arts. 141.º e 254.º do CPP).' },
  { id: 'pp9', d: 'pp', q: 'Qual é a finalidade do inquérito?', o: ['Comprovar judicialmente a decisão de deduzir acusação ou de arquivar', 'Investigar a existência de um crime, determinar os seus agentes e a sua responsabilidade e recolher as provas, em ordem à decisão sobre a acusação', 'Julgar o arguido', 'Aplicar medidas de coação'], a: 1,
    e: 'É a finalidade do inquérito prevista no art. 262.º, n.º 1, do CPP. A comprovação judicial da decisão de acusar ou arquivar é a finalidade da instrução (art. 286.º, n.º 1).' },

  // Direito Civil
  { id: 'cv1', d: 'civ', q: 'Qual é o prazo ordinário de prescrição no Código Civil?', o: ['5 anos', '10 anos', '15 anos', '20 anos'], a: 3,

  { id: 'cv2', d: 'civ', q: 'Em regra, o direito de indemnização fundado em responsabilidade civil extracontratual prescreve no prazo de:', o: ['1 ano', '3 anos', '5 anos', '20 anos'], a: 1,
    e: 'Prescreve no prazo de 3 anos a contar da data em que o lesado teve conhecimento do direito que lhe compete, sem prejuízo da prescrição ordinária (art. 498.º, n.º 1, do CC).' },
  { id: 'cv3', d: 'civ', q: 'Na responsabilidade contratual, incumbe ao devedor provar que a falta de cumprimento ou o cumprimento defeituoso não procede de culpa sua. A norma é o:', o: ['Art. 483.º do CC', 'Art. 487.º do CC', 'Art. 799.º do CC', 'Art. 562.º do CC'], a: 2,
    e: 'É a presunção de culpa do devedor (art. 799.º, n.º 1, do CC). Na responsabilidade extracontratual, cabe ao lesado provar a culpa do autor da lesão, salvo presunção legal (art. 487.º, n.º 1).' },
  { id: 'cv4', d: 'civ', q: 'A nulidade de um negócio jurídico:', o: ['Só pode ser invocada pelas pessoas em cujo interesse a lei a estabelece', 'É invocável a todo o tempo por qualquer interessado e pode ser declarada oficiosamente pelo tribunal', 'Sana-se pelo decurso de 1 ano', 'Só pode ser declarada a requerimento do Ministério Público'], a: 1,
    e: 'A nulidade é invocável a todo o tempo por qualquer interessado e pode ser declarada oficiosamente pelo tribunal (art. 286.º do CC). A primeira opção descreve a legitimidade para arguir a anulabilidade (art. 287.º, n.º 1).' },
  { id: 'cv5', d: 'civ', q: 'Em regra, a anulabilidade deve ser arguida dentro de que prazo?', o: ['O ano subsequente à cessação do vício que lhe serve de fundamento', '3 anos a contar da celebração do negócio', '20 anos', 'A todo o tempo'], a: 0,
    e: 'A anulabilidade só pode ser arguida pelas pessoas em cujo interesse a lei a estabelece, dentro do ano subsequente à cessação do vício que lhe serve de fundamento (art. 287.º, n.º 1, do CC).' },
  { id: 'cv6', d: 'civ', q: 'É menor quem ainda não tiver completado:', o: ['16 anos', '17 anos', '18 anos', '21 anos'], a: 2,

  { id: 'cv7', d: 'civ', q: 'A compra e venda de imóveis só é válida se for celebrada:', o: ['Por documento particular simples', 'Verbalmente, perante testemunhas', 'Por escritura pública ou por documento particular autenticado', 'Por qualquer forma, ao abrigo da liberdade de forma'], a: 2,

  { id: 'cv8', d: 'civ', q: '"A validade da declaração negocial não depende da observância de forma especial, salvo quando a lei a exigir." Que princípio está aqui consagrado?', o: ['O princípio da autonomia privada', 'O princípio da liberdade de forma (art. 219.º do CC)', 'O princípio da boa-fé (art. 227.º do CC)', 'O princípio da tipicidade'], a: 1,

  { id: 'cv9', d: 'civ', q: 'Que norma manda atender, na fixação da indemnização, aos danos não patrimoniais que, pela sua gravidade, mereçam a tutela do direito?', o: ['Art. 496.º, n.º 1, do CC', 'Art. 494.º do CC', 'Art. 566.º do CC', 'Art. 70.º do CC'], a: 0,

  // Direito Constitucional
  { id: 'cn1', d: 'con', q: 'Os preceitos constitucionais respeitantes aos direitos, liberdades e garantias:', o: ['Dependem sempre de lei para serem aplicados', 'São diretamente aplicáveis e vinculam as entidades públicas e privadas', 'Vinculam apenas o Estado', 'Só são aplicáveis após regulamentação pelo Governo'], a: 1,

    e: 'A fiscalização preventiva está no art. 278.º. O art. 280.º regula a fiscalização concreta, o art. 281.º a fiscalização abstrata sucessiva e o art. 283.º a inconstitucionalidade por omissão.' },
  { id: 'cn4', d: 'con', q: 'O recurso para o Tribunal Constitucional de uma decisão que recusa a aplicação de uma norma com fundamento em inconstitucionalidade é um meio de:', o: ['Fiscalização preventiva', 'Fiscalização concreta', 'Fiscalização abstrata sucessiva', 'Inconstitucionalidade por omissão'], a: 1,

  { id: 'cn5', d: 'con', q: 'Em regra, a Assembleia da República pode rever a Constituição decorridos quantos anos sobre a data da publicação da última lei de revisão ordinária?', o: ['4 anos', '5 anos', '10 anos', 'Não há prazo'], a: 1,

  { id: 'cn6', d: 'con', q: 'Em que artigo da CRP está consagrado o princípio da igualdade?', o: ['Art. 2.º', 'Art. 13.º', 'Art. 18.º', 'Art. 20.º'], a: 1,
    e: 'O princípio da igualdade está no art. 13.º da CRP.' },
  { id: 'cn7', d: 'con', q: 'Que norma garante o acesso ao direito e aos tribunais, não podendo a justiça ser denegada por insuficiência de meios económicos?', o: ['Art. 20.º, n.º 1, da CRP', 'Art. 32.º da CRP', 'Art. 202.º da CRP', 'Art. 268.º da CRP'], a: 0,
    e: 'É o art. 20.º, n.º 1, da CRP (acesso ao direito e tutela jurisdicional efetiva).' },
  { id: 'cn8', d: 'con', q: 'Em que artigo da CRP estão os limites materiais da revisão constitucional?', o: ['Art. 284.º', 'Art. 286.º', 'Art. 288.º', 'Art. 289.º'], a: 2,
    e: 'Os limites materiais estão no art. 288.º. Os limites circunstanciais (estado de sítio ou de emergência) estão no art. 289.º.' },

  // Direito Penal
  { id: 'pn1', d: 'pen', q: '"Só pode ser punido criminalmente o facto descrito e declarado passível de pena por lei anterior ao momento da sua prática." Que princípio é este?', o: ['O princípio da culpa', 'O princípio da legalidade', 'O princípio da proporcionalidade', 'O princípio da intervenção mínima'], a: 1,
    e: 'É o princípio da legalidade (art. 1.º, n.º 1, do CP; cf. art. 29.º da CRP).' },
  { id: 'pn2', d: 'pen', q: 'Age com dolo eventual quem:', o: ['Representa o facto e atua com intenção de o realizar', 'Representa a realização do facto como consequência necessária da sua conduta', 'Representa a realização do facto como consequência possível da sua conduta e atua conformando-se com essa realização', 'Não chega a representar a possibilidade de realização do facto'], a: 2,
    e: 'É o dolo eventual (art. 14.º, n.º 3, do CP). As outras opções correspondem ao dolo direto (n.º 1), ao dolo necessário (n.º 2) e à negligência inconsciente (art. 15.º, al. b)).' },
  { id: 'pn3', d: 'pen', q: 'Salvo disposição em contrário, a tentativa só é punível se ao crime consumado corresponder pena superior a:', o: ['1 ano de prisão', '2 anos de prisão', '3 anos de prisão', '5 anos de prisão'], a: 2,

  { id: 'pn4', d: 'pen', q: 'São inimputáveis em razão da idade os menores de:', o: ['12 anos', '14 anos', '16 anos', '18 anos'], a: 2,
    e: 'Os menores de 16 anos são inimputáveis (art. 19.º do CP).' },
  { id: 'pn5', d: 'pen', q: 'Quais são as finalidades das penas e das medidas de segurança?', o: ['A retribuição e a expiação da culpa', 'A proteção de bens jurídicos e a reintegração do agente na sociedade', 'A intimidação geral da comunidade', 'A reparação do dano causado à vítima'], a: 1,

  { id: 'pn6', d: 'pen', q: 'Com que pena é punido o homicídio simples (art. 131.º do CP)?', o: ['Prisão de 3 a 10 anos', 'Prisão de 5 a 15 anos', 'Prisão de 8 a 16 anos', 'Prisão de 12 a 25 anos'], a: 2,

  { id: 'pn7', d: 'pen', q: 'Em regra, qual é a duração máxima da pena de prisão?', o: ['16 anos', '20 anos', '25 anos', '30 anos'], a: 1,

  { id: 'pn8', d: 'pen', q: 'Em que artigo do CP está prevista a legítima defesa?', o: ['Art. 31.º', 'Art. 32.º', 'Art. 34.º', 'Art. 35.º'], a: 1,
    e: 'A legítima defesa está no art. 32.º do CP. O art. 31.º enuncia as causas de exclusão da ilicitude em geral, o art. 34.º o direito de necessidade e o art. 35.º o estado de necessidade desculpante.' }

var CASOS = [

    perguntas: ['Quais são os efeitos da falta de contestação de B?', 'Em que situações esses efeitos não se produziriam?', 'O tribunal está obrigado a condenar B no pedido?'],
    topicos: ['Prazo de contestação: 30 dias a contar da citação (art. 569.º, n.º 1, do CPC).', 'Revelia operante: consideram-se confessados os factos articulados pelo autor (art. 567.º, n.º 1).', 'Exceções à revelia operante (art. 568.º), por exemplo: pluralidade de réus em que algum conteste, réu incapaz ou citado editalmente que permaneça em revelia absoluta, vontade das partes ineficaz para produzir o efeito jurídico pretendido, ou factos para cuja prova se exija documento escrito.', 'Após a confissão dos factos, o processo é facultado às partes para alegações escritas e a causa é julgada conforme for de direito (art. 567.º, n.º 2): a condenação não é automática e o juiz aprecia o enquadramento jurídico.'] },
  { id: 'caso-civ1', d: 'civ', titulo: 'Responsabilidade civil médica',

var LS_KEY = 'lexdesk_v1';
var Store = { mode: 'memory', data: {}, col: null, unsub: null };
function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
Store.loadLocal = function () {
  var raw = lsGet(LS_KEY);
  if (raw) { try { Store.data = JSON.parse(raw) || {}; } catch (e) { Store.data = {}; } }
  Store.mode = lsSet('lexdesk_probe', '1') ? 'local' : 'memory';
};
Store.saveLocal = function () { lsSet(LS_KEY, JSON.stringify(Store.data)); };
Store.all = function (kind) { return Object.keys(Store.data).map(function (k) { return Store.data[k]; }).filter(function (x) { return x && x.kind === kind; }); };
Store.get = function (id) { return Store.data[id]; };
Store.put = function (o) {
  o = clone(o); o.updatedAt = Date.now(); if (!o.createdAt) o.createdAt = o.updatedAt;
  Store.data[o.id] = o; Store.saveLocal();
  if (Store.mode === 'cloud' && Store.col) {
    Store.col.doc(o.id).set(o).catch(Store.cloudFail);
  }
  scheduleRender();
  return o;
};
Store.del = function (id) {
  delete Store.data[id]; Store.saveLocal();
  if (Store.mode === 'cloud' && Store.col) Store.col.doc(id).delete().catch(Store.cloudFail);
  scheduleRender();
};
Store.cloudFail = function (e) {
  if (Store.mode !== 'cloud') return;
  if (Store.unsub) { try { Store.unsub(); } catch (x) {} }
  Store.unsub = null; Store.col = null;
  Store.mode = lsSet('lexdesk_probe', '1') ? 'local' : 'memory';
  Store.saveLocal();
  toast(e && e.code === 'quota_exceeded' ? 'O espaço da conta está cheio. Os dados passam a ficar guardados neste navegador.' : 'Não foi possível guardar na sua conta. Os dados passam a ficar guardados neste navegador.');
  renderSide();
};
Store.connect = function () {
  if (!SB) { Social.updState = 'offline'; return; }
  Store.db = SBdb; S.user = SBuser; Social.start();
  SB.auth.getSession().then(function (r) {
    var se = r && r.data && r.data.session;
    if (se) Store.attach(se); else { S.connecting = false; scheduleRender(); }
  }).catch(function () {});
  SB.auth.onAuthStateChange(function (ev, se) {
    if (se && (!Store.uid || Store.uid !== se.user.id)) setTimeout(function () { Store.attach(se); }, 0);
    else if (se) SBuser.session = se;
  });
};
Store.attach = function (session) {
  if (Store.uid === session.user.id) return;
  SBuser.session = session; Store.uid = session.user.id; S.connecting = false;
  SBuser.me().then(function (me) { if (me && me.name) { S.nomeFull = String(me.name); S.nome = S.nomeFull.split(' ')[0]; scheduleRender(); } }).catch(function () {});
  SBdb.refreshAll(); scheduleRender();
  var col = SBdb.collection('data/users/' + Store.uid);
  var first = true;
  Store.unsub = col.onSnapshot(function (snap) {
    var cloud = {};
    snap.docs.forEach(function (d) { cloud[d.id] = clone(d.data()); });
    if (first) {
      first = false; Store.col = col; Store.mode = 'cloud';
      // Envia para a conta o que já existia neste navegador e ainda não está lá
      var pend = Object.keys(Store.data).filter(function (k) { return !cloud[k]; });
      (function next(i) {
        if (i >= pend.length) return;
        col.doc(pend[i]).set(Store.data[pend[i]]).then(function () { next(i + 1); }).catch(Store.cloudFail);
      })(0);
      pend.forEach(function (k) { cloud[k] = Store.data[k]; });
    }
    Store.data = cloud; Store.saveLocal(); renderSide(); scheduleRender();
  }, function () { Store.cloudFail(); });
};
